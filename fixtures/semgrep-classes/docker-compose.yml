# Annotated fixture for manifests/semgrep-classes/container-privilege.yaml.
services:
  agent:
    image: example/agent:1
    # ruleid: cw-compose-privileged-container
    privileged: true
    # ruleid: cw-compose-privileged-container
    network_mode: host
    volumes:
      # ruleid: cw-compose-docker-socket-mount
      - /var/run/docker.sock:/var/run/docker.sock
      # ok: cw-compose-docker-socket-mount
      - ./data:/data
    cap_add:
      # ruleid: cw-compose-host-root-capability
      - SYS_ADMIN
      # ok: cw-compose-host-root-capability
      - NET_BIND_SERVICE
  web:
    image: example/web:1
    # ok: cw-compose-privileged-container
    privileged: false
    # ok: cw-compose-privileged-container
    network_mode: bridge
  ci:
    image: example/ci:1
    volumes:
      # ruleid: cw-compose-docker-socket-mount
      - ${DOCKER_SOCKET}:/var/run/docker.sock
      - type: bind
        # ruleid: cw-compose-docker-socket-mount
        source: /var/run/docker.sock
        target: /var/run/docker.sock
