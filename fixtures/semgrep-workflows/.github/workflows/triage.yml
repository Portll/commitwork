name: triage
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened]
permissions:
  contents: read
jobs:
  issue-title-in-prompt:
    runs-on: ubuntu-latest
    steps:
      - uses: example/model-action@v1
        with:
          # ruleid: workflow-llm-prompt-untrusted-input
          prompt: "Summarise this issue: ${{ github.event.issue.title }}"
  comment-body-in-prompt:
    runs-on: ubuntu-latest
    steps:
      - uses: example/agent-action@v1
        with:
          # ruleid: workflow-llm-prompt-untrusted-input
          direct_prompt: "Reply to ${{ github.event.comment.body }}"
  branch-name-in-system-prompt:
    runs-on: ubuntu-latest
    steps:
      - uses: example/model-action@v1
        with:
          # ruleid: workflow-llm-prompt-untrusted-input
          system_prompt: "You are reviewing branch ${{ github.head_ref }}"
  number-only:
    runs-on: ubuntu-latest
    steps:
      - uses: example/model-action@v1
        with:
          # ok: workflow-llm-prompt-untrusted-input
          prompt: "Label the issue numbered ${{ github.event.issue.number }}"
  step-output:
    runs-on: ubuntu-latest
    steps:
      - id: read
        run: echo "text=hello" >> "$GITHUB_OUTPUT"
      - uses: example/model-action@v1
        with:
          # ok: workflow-llm-prompt-untrusted-input
          prompt: "Classify ${{ steps.read.outputs.text }}"
  title-outside-a-prompt:
    runs-on: ubuntu-latest
    steps:
      - uses: example/label-action@v1
        with:
          # ok: workflow-llm-prompt-untrusted-input
          label: "${{ github.event.issue.title }}"
  open-to-anyone:
    runs-on: ubuntu-latest
    steps:
      - uses: example/agent-action@v1
        with:
          # ruleid: workflow-llm-agent-open-to-anyone
          allowed_non_write_users: "*"
  named-users:
    runs-on: ubuntu-latest
    steps:
      - uses: example/agent-action@v1
        with:
          # ok: workflow-llm-agent-open-to-anyone
          allowed_non_write_users: "octo-reviewer"
