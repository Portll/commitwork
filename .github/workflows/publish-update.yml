name: Publish update

# portll-update@1: the signed manifest `commitwork update` and the panel's daily check read.
#   beta    every push to main
#   stable  a v* release, once release.yml has created its GitHub release: the publisher adds
#           portll-update.json to that release, so it must exist first. Triggered by release.yml
#           completing rather than by the tag, because both creating the release would race and
#           release.yml's `gh release create` refuses one that exists.
# The work is spine's reusable workflow (Portll/spine .github/workflows/publish-update.yml), on the
# self-hosted runner that holds the signing key and the R2 credentials. It depends on the spine
# change that adds that workflow; until it lands on spine main this workflow fails at the call.
# The artefact is the npm-pack tarball, packed here exactly as release.yml packs it.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Release]
    types: [completed]

concurrency:
  group: publish-update-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  pack:
    name: Pack the tarball
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      channel: ${{ steps.v.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # a stable publish packs the tagged commit release.yml built, not main's head
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Version and channel
        id: v
        env:
          EVENT: ${{ github.event_name }}
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$EVENT" = workflow_run ]; then channel=stable; else channel=beta; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Pack
        run: |
          mkdir -p dist
          npm pack --ignore-scripts --pack-destination dist
          test -f "dist/commitwork-${{ steps.v.outputs.version }}.tgz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-artifact
          path: dist/commitwork-${{ steps.v.outputs.version }}.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Sign and publish
    needs: pack
    permissions:
      contents: write
    # Branch-pinned on purpose: the reusable workflow and this file ship as one change across two
    # repositories. Pin it to a commit SHA once the spine side is merged.
    uses: Portll/spine/.github/workflows/publish-update.yml@main # zizmor: ignore[unpinned-uses] pinned after the spine PR lands
    with:
      product: commitwork
      channel: ${{ needs.pack.outputs.channel }}
      version: ${{ needs.pack.outputs.version }}
      artifact: update-artifact
      file: commitwork-${{ needs.pack.outputs.version }}.tgz
      github: ${{ needs.pack.outputs.channel == 'stable' }}
