name: GitHub Action

# Diagnostic branch only, never merged: measures pasta's DNS forwarding on ubuntu-latest.

on:
  push:
    branches: ['diag/**']
    paths:
      - .github/workflows/github-action.yml
      - bin/test/diag-pasta.mjs

permissions:
  contents: read

jobs:
  diag:
    name: pasta DNS on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Tools
        run: |
          set +e
          head -2 /etc/os-release
          if grep -q '24\.04' /etc/os-release; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends bubblewrap passt > /dev/null
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          dpkg-query -W passt bubblewrap
          sysctl kernel.apparmor_restrict_unprivileged_userns
          pasta --help 2>&1 | grep -nE 'dns-host|dns-forward|outbound'
      - name: Variants through the product path
        run: |
          set +e
          node bin/test/diag-pasta.mjs
          echo "exit=$?"
