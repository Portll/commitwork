# Test fixtures whose credentials are planted and fabricated on purpose; each file documents its
# plants. GitHub secret scanning and push protection skip these paths. Anything else that carries a
# provider-shaped token fails bin/test/push-protection-shapes.test.mjs.
paths-ignore:
  - "fixtures/scan-canary/dirty/**"
  - "fixtures/scan-canary/EXPECTED.json"
  - "fixtures/scan-canary/README.md"
  - "monitor/test/fixtures/detection-lanes/labelled-findings.json"
  # Golden output of a betterleaks run over a hand-written seed: an amqp URL and a password
  # literal, both with the value REDACTED (PROVENANCE.json, secretsBetterleaks).
  - "monitor/test/fixtures/lane-capability/secretsBetterleaks/betterleaks.json"
  # Golden output of a trufflehog run over a hand-written seed with replayed history: one
  # fabricated database URL for a fixture host (PROVENANCE.json, secretsHistory).
  - "monitor/test/fixtures/lane-capability/secretsHistory/trufflehog.json"
