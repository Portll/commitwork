<!-- commitwork Mainline tab — feature d (git-graph as a forking motorway).
     Data: ./data/mainline.<slug>.json  (schema mainline/v1, generated by bin/mainline-data.mjs from a
     REAL git repo via `git log --all` + `git rev-list --parents` — never synthetic).
     The DAG is a motorway: lane 0 = the wide central CARRIAGEWAY running along Z (time, newest→oldest),
     forks are LANES that diverge (offramp) and merge back (onramp) on smooth curves, commits are road
     MARKERS/SIGNS, merge commits are INTERCHANGES. Vendored three.js r144 UMD (MIT) — no CDN, no build.
     All commit strings are UNTRUSTED (harvested subjects/authors/refs): esc() on every DOM render. -->

<script>
'use strict';
// ── safety helpers (harvested commit strings are untrusted input) ────────────────────────────────
const esc=(x)=>String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const $=(id)=>document.getElementById(id);

// ── layout constants (the road geometry) ─────────────────────────────────────────────────────────
const ROW_Z   = 9;      // world units between consecutive commit rows along the time axis (Z)
const LANE_X  = 11;     // world units between adjacent lanes (X)
const MAIN_W  = 6.4;    // carriageway half-width (lane 0)
const LANE_W  = 2.6;    // fork-lane half-width
const MARK_R  = 1.5;    // commit marker radius
const CURVE   = 5.5;    // Z-length of the offramp/onramp easing between a fork lane and its target

// map a (lane,row) to a world position. Z decreases with row so newest (row 0) is nearest camera-front.
const laneX=(lane)=>lane*LANE_X;
const rowZ =(row )=>-row*ROW_Z;

// theme colours pulled from CSS custom props so the two never drift
const css=(n)=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const COL={};
function readPalette(){
  Object.assign(COL,{main:css('--main'),fork:css('--fork'),merge:css('--merge'),sign:css('--sign'),road:css('--road'),
    roadEdge:css('--road-edge'),bg:css('--stage'),gridA:css('--grid-a'),gridB:css('--grid-b'),post:css('--post')});
}

// ── three.js scene (built once; one renderer for the life of the tab) ────────────────────────────
let scene,camera,renderer,controls,raf,spin=false;
// prefers-reduced-motion: nothing rotates the view, the spin toggle included (see the toggles)
const REDUCED_MOTION=typeof matchMedia==='function'&&matchMedia('(prefers-reduced-motion: reduce)').matches;
let markMeta=[];             // per-marker metadata parallel to raycast hits
let pickMeshes=[];           // meshes eligible for raycasting (commit markers)
const stage=$('stage'), tip=$('tip');
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2();
let labelEls=[];             // {el, pos:Vector3} HTML ref labels projected each frame
const tmp=new THREE.Vector3();

function initRenderer(){
  const W=stage.clientWidth||800, H=stage.clientHeight||600;
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(W,H); renderer.setPixelRatio(Math.min(2,devicePixelRatio||1));
  stage.appendChild(renderer.domElement);
  camera=new THREE.PerspectiveCamera(52,W/H,1,20000);
  controls=new THREE.OrbitControls(camera,renderer.domElement);
  controls.enableDamping=true; controls.dampingFactor=.08;
  controls.maxPolarAngle=Math.PI*0.495;   // stay above the road plane
  // WCAG 2.1.1: arrow keys pan and Shift/Ctrl+arrows rotate once the canvas has focus; plus and
  // minus zoom. The commit list below the stage is the keyboard route to what the tooltip shows.
  renderer.domElement.tabIndex=0;
  renderer.domElement.setAttribute('role','application');
  renderer.domElement.setAttribute('aria-label','commit history: arrow keys move the view, Shift or Ctrl with an arrow rotates, plus and minus zoom; the commit list below the view lists every commit as text');
  controls.listenToKeyEvents(renderer.domElement);
  renderer.domElement.addEventListener('keydown',(e)=>{
    const out=e.key==='-'||e.key==='_', inn=e.key==='+'||e.key==='=';
    if(!out&&!inn)return;
    e.preventDefault();
    const off=camera.position.clone().sub(controls.target);
    const d=THREE.MathUtils.clamp(off.length()*(out?1.15:1/1.15),controls.minDistance,controls.maxDistance);
    camera.position.copy(controls.target).add(off.setLength(d));controls.update();
  });
  renderer.domElement.addEventListener('pointermove',onMove);
  renderer.domElement.addEventListener('pointerleave',()=>{tip.style.display='none';});
  addEventListener('resize',onResize);
}
function onResize(){ if(!renderer)return;
  const W=stage.clientWidth,H=stage.clientHeight;
  camera.aspect=W/H; camera.updateProjectionMatrix(); renderer.setSize(W,H);
}

// ── road ribbon: a flat quad strip that eases from a fork lane onto its target lane ──────────────
// Produces a smooth S-curve (offramp/onramp) in X while advancing in Z. Uses a cosine ease so the
// tangents are flat at both ends — the ramp kisses the carriageway rather than kinking into it.
function ribbon(xA,zA,xB,zB,halfW,colorHex,opacity){
  const segs=Math.max(2,Math.round(Math.abs(zB-zA)/2)+2);
  const pos=[], idx=[];
  for(let i=0;i<=segs;i++){
    const t=i/segs;
    const ez=(t);                              // linear in Z
    const ex=(1-Math.cos(t*Math.PI))/2;        // cosine ease in X (flat tangents at both ends)
    const x=xA+(xB-xA)*ex, z=zA+(zB-zA)*ez;
    pos.push(x-halfW,0,z, x+halfW,0,z);
  }
  for(let i=0;i<segs;i++){
    const a=i*2; idx.push(a,a+1,a+2, a+1,a+3,a+2);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setIndex(idx); g.computeVertexNormals();
  const m=new THREE.MeshBasicMaterial({color:colorHex,transparent:true,opacity,side:THREE.DoubleSide,
    depthWrite:false});
  return new THREE.Mesh(g,m);
}

function buildScene(M){
  readPalette();
  scene=new THREE.Scene();
  scene.background=new THREE.Color(COL.bg);
  scene.fog=new THREE.FogExp2(COL.bg,0.0);   // density set once we know the extent

  const commits=M.commits||[];
  const bySha=new Map(commits.map(c=>[c.sha,c]));
  const maxRow=commits.reduce((a,c)=>Math.max(a,c.row),0);
  const maxLane=(M.lanes||1)-1;
  const spanZ=(maxRow+1)*ROW_Z, spanX=(maxLane+1)*LANE_X;
  scene.fog.density=1/Math.max(220,spanZ*0.9);

  // lights (kept soft — the road reads by colour, not shading)
  scene.add(new THREE.AmbientLight(0xffffff,0.7));
  const dl=new THREE.DirectionalLight(0xffffff,0.55); dl.position.set(60,140,40); scene.add(dl);

  // ground grid under the whole interchange
  const gh=new THREE.GridHelper(Math.max(spanZ,spanX)*1.4,48,COL.gridA,COL.gridB);
  gh.position.set(spanX/2-LANE_X/2, -0.6, -spanZ/2); scene.add(gh);

  // ── 1. CARRIAGEWAY: one long central ribbon down lane 0 (the mainline) ────────────────────────
  const mainZ0=rowZ(0)+ROW_Z*0.6, mainZ1=rowZ(maxRow)-ROW_Z*0.6;
  const carriage=ribbon(0,mainZ0,0,mainZ1,MAIN_W,COL.road,0.92);
  scene.add(carriage);
  // dashed centre-line down the carriageway (the accent seam)
  const dashPts=[];
  for(let r=0;r<=maxRow;r++){ dashPts.push(new THREE.Vector3(0,0.05,rowZ(r))); }
  if(dashPts.length>1){
    const dg=new THREE.BufferGeometry().setFromPoints(dashPts);
    const dm=new THREE.LineDashedMaterial({color:COL.main,dashSize:3,gapSize:3.4,transparent:true,opacity:.85});
    const dl2=new THREE.Line(dg,dm); dl2.computeLineDistances(); scene.add(dl2);
  }

  // ── 2. LANE ROADS: for every non-mainline lane, draw its road plus offramp/onramp easings ─────
  // A lane's road spans the rows where any commit sits in that lane. Where an edge crosses lanes
  // (a fork diverging or a branch merging back), we draw a ribbon easing between the two lanes.
  const laneRows=new Map();  // lane -> {min,max}
  for(const c of commits){ if(c.lane===0)continue;
    const e=laneRows.get(c.lane)||{min:1e9,max:-1e9};
    e.min=Math.min(e.min,c.row); e.max=Math.max(e.max,c.row); laneRows.set(c.lane,e);
  }
  for(const [lane,e] of laneRows){
    const x=laneX(lane);
    const road=ribbon(x,rowZ(e.min)+ROW_Z*0.5,x,rowZ(e.max)-ROW_Z*0.5,LANE_W,COL.road,0.8);
    scene.add(road);
  }

  // edges between commits → the connective ramps. Child sits nearer camera (lower row), parent
  // deeper. We ramp from the child's lane toward the parent's lane over CURVE units, then run
  // straight in the parent lane the rest of the way.
  for(const c of commits){
    const inWin=(c.parentsInWindow&&c.parentsInWindow.length)?c.parentsInWindow:c.parents;
    (inWin||[]).forEach((psha,idx)=>{
      const p=bySha.get(psha); if(!p)return;   // out-of-window parent → drawn as faded stub below
      const xC=laneX(c.lane), xP=laneX(p.lane);
      const zC=rowZ(c.row), zP=rowZ(p.row);
      const sameLane=(c.lane===p.lane);
      // colour: crossing INTO lane 0 = merge/return (green); staying = carriageway/fork colour
      const crossing=!sameLane;
      const toMain=(p.lane===0);
      const color= crossing ? (toMain?COL.merge:COL.fork) : (c.lane===0?COL.main:COL.fork);
      const hw = (c.lane===0&&p.lane===0)?MAIN_W:LANE_W;
      if(sameLane){
        // straight run in one lane — a slim ribbon segment (skip if carriageway, already drawn)
        if(c.lane!==0){
          scene.add(ribbon(xC,zC,xP,zP,LANE_W*0.9,color,0.7));
        }
      }else{
        // ease over the first CURVE units toward the parent lane, then straight to the parent row
        const rampZ=Math.max(zP, zC-Math.min(CURVE,Math.abs(zC-zP)));
        scene.add(ribbon(xC,zC,xP,rampZ,hw*0.9,color,0.82));
        if(rampZ>zP+0.01) scene.add(ribbon(xP,rampZ,xP,zP,LANE_W*0.9,toMain?COL.merge:COL.fork,0.6));
      }
    });
    // faded stub for parents that fall outside the harvest window (honest: history continues)
    const stubs=(c.parents||[]).filter(p=>!bySha.has(p));
    if(stubs.length){
      const xC=laneX(c.lane), zC=rowZ(c.row);
      const s=ribbon(xC,zC,xC,zC-ROW_Z*0.8,LANE_W*0.7,COL.roadEdge,0.35); scene.add(s);
    }
  }

  // ── 3. COMMIT MARKERS + SIGNS + INTERCHANGES ──────────────────────────────────────────────────
  markMeta=[]; pickMeshes=[];
  const markGeo=new THREE.SphereGeometry(MARK_R,16,12);
  const interGeo=new THREE.OctahedronGeometry(MARK_R*1.8,0);   // interchange = octahedron
  for(const c of commits){
    const x=laneX(c.lane), z=rowZ(c.row);
    const isMerge=c.isMerge;
    const onMain=c.lane===0;
    const col=isMerge?COL.merge:(onMain?COL.main:COL.fork);
    const mat=new THREE.MeshStandardMaterial({color:col,emissive:col,emissiveIntensity:.35,
      roughness:.5,metalness:.1});
    const mesh=new THREE.Mesh(isMerge?interGeo:markGeo,mat);
    mesh.position.set(x,MARK_R+0.3,z);
    scene.add(mesh);
    pickMeshes.push(mesh);
    markMeta.push({mesh,c});
    // glow halo for interchanges so they read as junctions
    if(isMerge){
      const halo=new THREE.Mesh(new THREE.RingGeometry(MARK_R*2.2,MARK_R*2.8,20),
        new THREE.MeshBasicMaterial({color:COL.merge,transparent:true,opacity:.4,side:THREE.DoubleSide,depthWrite:false}));
      halo.rotation.x=-Math.PI/2; halo.position.set(x,0.1,z); scene.add(halo);
    }
  }

  // ── 4. HTML ref labels (branch/tag decorations) projected per frame ───────────────────────────
  labelEls.forEach(o=>o.el.remove()); labelEls=[];
  for(const c of commits){
    if(!c.refs||!c.refs.length)continue;
    const el=document.createElement('div'); el.className='lbl';
    el.textContent=c.refs.map(r=>r.replace(/^tag:/,'⚑')).join(' · ');
    stage.appendChild(el);
    labelEls.push({el,pos:new THREE.Vector3(laneX(c.lane),MARK_R+4,rowZ(c.row))});
  }
  applyLabelVis(); applySignVis(commits);

  // ── camera framing ────────────────────────────────────────────────────────────────────────────
  const cx=spanX/2-LANE_X/2, cz=-spanZ/2;
  controls.target.set(cx,2,cz);
  camera.position.set(cx+spanX*0.5+40, Math.max(60,spanZ*0.28), cz+spanZ*0.62);
  camera.far=Math.max(20000,spanZ*8); camera.updateProjectionMatrix();
  controls.update();
}

// ── road signs: little upright sign-boards at each commit carrying the short sha ─────────────────
let signGroup=null;
function applySignVis(commits){
  if(signGroup){scene.remove(signGroup);signGroup.traverse(o=>{o.geometry&&o.geometry.dispose();o.material&&o.material.dispose();});signGroup=null;}
  if(!$('t-signs').classList.contains('on'))return;
  signGroup=new THREE.Group();
  const postGeo=new THREE.CylinderGeometry(0.12,0.12,3.2,6);
  const postMat=new THREE.MeshBasicMaterial({color:COL.post});
  for(const c of commits){
    const x=laneX(c.lane), z=rowZ(c.row);
    const post=new THREE.Mesh(postGeo,postMat); post.position.set(x+ (c.lane===0?MAIN_W+1.2:LANE_W+1),1.6,z);
    signGroup.add(post);
    const boardMat=new THREE.MeshBasicMaterial({color: c.isMerge?COL.merge:(c.lane===0?COL.main:COL.fork),
      transparent:true,opacity:.85,side:THREE.DoubleSide});
    const board=new THREE.Mesh(new THREE.PlaneGeometry(3.4,1.4),boardMat);
    board.position.set(x+(c.lane===0?MAIN_W+1.2:LANE_W+1),3.4,z);
    signGroup.add(board);
  }
  scene.add(signGroup);
}
function applyLabelVis(){
  const on=$('t-labels').classList.contains('on');
  labelEls.forEach(o=>{o.el.style.display=on?'':'none';});
}

// ── interaction ───────────────────────────────────────────────────────────────────────────────
function onMove(ev){
  if(!renderer||!pickMeshes.length)return;
  const r=renderer.domElement.getBoundingClientRect();
  mouse.x=((ev.clientX-r.left)/r.width)*2-1;
  mouse.y=-((ev.clientY-r.top)/r.height)*2+1;
  ray.setFromCamera(mouse,camera);
  const hit=ray.intersectObjects(pickMeshes,false)[0];
  if(!hit){tip.style.display='none';return;}
  const meta=markMeta.find(m=>m.mesh===hit.object); if(!meta){tip.style.display='none';return;}
  const c=meta.c;
  const kind=c.isMerge?'<span class="b" style="background:color-mix(in srgb,var(--merge) 16%,transparent);color:var(--merge)">INTERCHANGE</span>'
    :(c.lane===0?'<span class="b" style="background:color-mix(in srgb,var(--main) 16%,transparent);color:var(--main)">CARRIAGEWAY</span>'
    :'<span class="b" style="background:color-mix(in srgb,var(--fork) 16%,transparent);color:var(--fork)">LANE '+c.lane+'</span>');
  const refs=(c.refs&&c.refs.length)?'<div class="m">'+c.refs.map(esc).join(' · ')+'</div>':'';
  const date=c.date?new Date(c.date).toLocaleString():'';
  tip.innerHTML=`<span class="s">${esc(c.subject)}</span>`+
    `<span class="p">${esc(c.short)}</span> · ${kind}`+
    `<div class="m">${esc(c.author)}${date?' · '+esc(date):''}</div>`+refs;
  tip.style.display='block';
  const px=ev.clientX-r.left+12, py=ev.clientY-r.top+12;
  tip.style.left=Math.min(px,r.width-tip.offsetWidth-8)+'px';
  tip.style.top=Math.min(py,r.height-tip.offsetHeight-8)+'px';
}

function animate(){
  raf=requestAnimationFrame(animate);
  if(controls){controls.autoRotate=spin&&!REDUCED_MOTION;controls.autoRotateSpeed=0.5;}
  controls&&controls.update();
  renderer&&renderer.render(scene,camera);
  // project HTML ref labels
  if(labelEls.length){
    const r=renderer.domElement;
    for(const o of labelEls){
      if(o.el.style.display==='none')continue;
      tmp.copy(o.pos).project(camera);
      const behind=tmp.z>1;
      o.el.style.display=behind?'none':'';
      o.el.style.left=((tmp.x*0.5+0.5)*r.clientWidth)+'px';
      o.el.style.top=((-tmp.y*0.5+0.5)*r.clientHeight)+'px';
    }
  }
}

// ── toggles ──────────────────────────────────────────────────────────────────────────────────
function wire(id,fn){const b=$(id);b.addEventListener('click',()=>{b.classList.toggle('on');b.setAttribute('aria-pressed',String(b.classList.contains('on')));fn();});}
wire('t-labels',applyLabelVis);
wire('t-spin',()=>{spin=$('t-spin').classList.contains('on');});
$('t-spin').classList.remove('on');
// Under reduced motion the spin is unavailable and the button says why; dragging still orbits.
if(REDUCED_MOTION){$('t-spin').disabled=true;$('t-spin').title='off: the system asks for reduced motion';}
$('t-signs').addEventListener('click',()=>{$('t-signs').classList.toggle('on');$('t-signs').setAttribute('aria-pressed',String($('t-signs').classList.contains('on')));if(window.__M)applySignVis(window.__M.commits);});

// ── boot / data load (graceful empty state) ──────────────────────────────────────────────────
const SLUG=(new URLSearchParams(location.search).get('project')||'commitwork').toLowerCase().replace(/[^a-z0-9-]/g,'');
function showEmpty(msg,cmd){
  $('empty').style.display='flex'; $('legend').style.display='none';
  if(msg)$('empty-msg').textContent=msg;
  if(cmd)$('empty-cmd').textContent=cmd;
  $('tag').textContent='no data'; $('tag').style.borderColor='var(--crit)'; $('tag').style.color='var(--crit)';
  $('foot').innerHTML=`<span style="color:var(--crit)">no mainline data for ${esc(SLUG)}</span>`;
}
function boot(M){
  if(!M||!Array.isArray(M.commits)||!M.commits.length){ showEmpty(); return; }
  window.__M=M;
  $('tag').textContent=`${esc(M.slug||SLUG)} · ${(M.branchTip&&M.branchTip.name)?esc(M.branchTip.name):'HEAD'}`;
  $('tag').style.borderColor='var(--live)'; $('tag').style.color='var(--live)';
  initRenderer();
  buildScene(M);
  animate();
  const kind=(c)=>c.isMerge?'merge':(c.lane===0?'main branch':'lane '+c.lane);
  $('commit-list').innerHTML=[...M.commits].sort((a,b)=>a.row-b.row).map(c=>
    `<li><b>${esc(c.subject)}</b> <span class="m">· ${esc(c.short)} · ${esc(kind(c))}`+
    `${c.author?' · '+esc(c.author):''}${c.date?' · '+esc(new Date(c.date).toLocaleString()):''}`+
    `${c.refs&&c.refs.length?' · '+c.refs.map(esc).join(', '):''}</span></li>`).join('');
  $('commits').hidden=false;
  const merges=M.commits.filter(c=>c.isMerge).length;
  const trunc=M.truncation?` · <span style="color:var(--part)">${esc(M.truncation.note)}</span>`:'';
  const genH=M.generated?((Date.now()-new Date(M.generated).getTime())/3.6e6):NaN;
  const fresh=isFinite(genH)?`<span style="color:${genH<24?'var(--live)':'var(--part)'}">harvested ${genH<1?'just now':genH<24?Math.round(genH)+'h ago':Math.round(genH/24)+'d ago'}</span>`:'';
  $('foot').innerHTML=`<span><b>${M.commits.length}</b> commits</span>`+
    `<span><b>${M.lanes}</b> lanes</span><span><b>${merges}</b> interchanges</span>`+
    `<span>tip <b>${esc((M.branchTip&&M.branchTip.name)||'')}</b></span>${fresh}${trunc}`;
}
// A mode change rebuilds the scene in the new palette and keeps the reader's view.
addEventListener('cw-mode',()=>{
  if(!window.__M||!renderer)return;
  const pos=camera.position.clone(), at=controls.target.clone();
  buildScene(window.__M);
  camera.position.copy(pos); controls.target.copy(at); controls.update();
});
fetch(`./data/mainline.${SLUG}.json?project=${encodeURIComponent(SLUG)}`)
  .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
  .then(boot)
  .catch(e=>{ showEmpty(`Could not load data/mainline.${SLUG}.json (${e.message}). Generate it with:`,
    `node bin/mainline-data.mjs <repoDir> --slug ${SLUG}`); });
</script>
</body>
</html>
