/* Responsive root font by PHYSICAL display resolution: 1080p panel = 16px (100%), a physical 4K
   (2160p) panel = 32px (DOUBLE) — regardless of OS HiDPI scaling, because screen.height*dpr yields
   true device pixels (dpr cancels the OS scale factor). The CSS html{font-size:clamp(...100vh...)}
   below is the no-JS fallback; this overrides it with the physical-pixel basis. Re-runs on resize
   (window moved between monitors of different density). */
(function(){function px(){var dpr=window.devicePixelRatio||1;var h=(window.screen&&screen.height?screen.height:1080)*dpr;var s=Math.max(16,Math.min(32,16*h/1080));document.documentElement.style.fontSize=s+'px';}px();addEventListener('resize',px);})();
</script>

  var m=pinned()||own||stored()||(q&&q.matches?'light':'dark');
  if(d.getAttribute('data-mode')===m)return;

  set:function(t){if(!pick(t))return;own=t;try{localStorage.setItem(K,t);}catch(e){}apply();}};

<script>
'use strict';
// ── safety helpers (F4: manifest strings are untrusted input from scanned source) ─────────────
const esc=(x)=>String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const safeHref=(u)=>/^https?:\/\//i.test(String(u))?String(u):null;
const $=(id)=>document.getElementById(id);

// language palette — stable across themes (themes tint via HSL offsets)
const LANG_COLOR={java:'#e76f51',typescript:'#4f8ef7',javascript:'#f4d35e',sql:'#9b5de5',yaml:'#43aa8b',
  json:'#90a955',css:'#f28482',html:'#f77f00',markdown:'#8d99ae',shell:'#6a994e',dockerfile:'#00b4d8',
  config:'#b5838d',gradle:'#274c77',svg:'#ffafcc',binary:'#6c757d',lockfile:'#6c757d',scss:'#f28482',
  unknown:'#495057'};
const langColor=(l)=>LANG_COLOR[l]||'#495057';

// ── manifest v2 (additive) ─────────────────────────────────────────────────────────────────────
// The data layer (harvest.mjs / monitor/sitemap-data.mjs) is growing v2 facets consumed here.
// Field contract (bound to the data agent's real key names; each is FEATURE-DETECTED and every
// layer degrades to nothing when its field is absent — a v1 manifest NEVER crashes the renderer):
//   symbol.span            {startLine,endLine}  (per-function extent; sizes the exploded sub-box)
//   service.wiring         [{from:{file,symbol}, to:{file,symbol}, count?}]  func→func call edges → ROADS
//   service.fileWiring     [{from,to,count?}]   (file-path import edges, svc-relative) → WIRING
//   M.airBridges           [{from,to,kind,count?,secure?}]  (svc-id→svc-id secure corridors) → AIR BRIDGES
//   node.logging           truthy/count         (this file emits logs)
//   node.logSink|M.logSinks {service,file}|[…]  (where reporting/logging drains) → SEWER
//   io/log entry .category=='audit' (or oauth io) → AUDITING-as-wiring
//   M.vulnerabilities      [{id,severity,target:{scope:'container'|'file'|'function',ref},pkg,
//                            installed,fixed,title,chain?,source,provenance}] → CVE STACKING GLOWS
// V2 flags — set true once the real field is seen so honest-provenance chrome can say "live" vs "demo".
const V2={span:false,wiring:false,fileWiring:false,airBridges:false,logging:false,vuln:false};
// Every severity colour reads at 4.5:1 or better against the #141a22 panels, as text and as a swatch.
const SEV_COLOR={critical:0xff4d5e,high:0xff6a00,medium:0xffd400,low:0x9aa7b5}; // red / orange / yellow / grey
const SEV_RANK={critical:4,high:3,medium:2,low:1};
// Severity is also carried by a text label, so it never rests on colour alone. An unrecognised
// severity gets its own colour and '?' rather than borrowing high's.
const SEV_UNKNOWN=0xb58cff;
// A light ground needs the deep ramp: the bright one's yellow is 1.3:1 on paper. Same hue order.
const SEV_COLOR_LIGHT={critical:0xc62828,high:0xb54708,medium:0x806500,low:0x5b6675};
const SEV_UNKNOWN_LIGHT=0x7b2ff7;
const SEV_LABEL={critical:'CRIT',high:'HIGH',medium:'MED',low:'LOW'};
const sevColor=(s)=>SEV_COLOR[s]??SEV_UNKNOWN;
const sevLabel=(s)=>SEV_LABEL[s]||'?';
// The CSS token for a severity's text colour, which follows the page mode (--sev-* in <style>).
const sevVar=(s)=>'var(--sev-'+(Object.prototype.hasOwnProperty.call(SEV_COLOR,s)?s:'unknown')+')';
// The pulse scales each part's own opacity, so a glow's edge stays brighter than its body at every
// phase. Reduced motion holds the phase still; the label carries severity without the pulse rate.
const REDUCED_MOTION=typeof matchMedia==='function'&&matchMedia('(prefers-reduced-motion: reduce)').matches;
// It stills the slow drift the slab views auto-rotate with, too.
const spinRate=(t)=>REDUCED_MOTION?0:(t.autoRotate||0);
const pulseOpacity=(op0,n,ph)=>Math.min(1,op0*(0.6+0.4*Math.min(4,n)/4)*(0.8+0.4*ph));
// vuln-TYPE → deformation/fault character (used by exterior views + tooltip). Heuristic map over
// the pkg/title text; honest — falls back to 'generic'. Kept here so interior + exterior agree.
function vulnType(v){
  const t=((v.title||'')+' '+(v.pkg||'')).toLowerCase();
  if(/buffer|overflow|memory|use.after.free|oob|out.of.bounds|segfault/.test(t))return 'memory';   // jagged crack
  if(/outdated|deprecated|end.of.life|version|upgrade|stale/.test(t))return 'corrosion';            // rust/pitting
  if(/auth|jwt|oauth|token|session|privilege|access.control|bola|idor|bypass/.test(t))return 'breach'; // hole
  if(/inject|sql|xss|rce|command|deserial|ssrf|traversal/.test(t))return 'fracture';                // splitting shard
  if(/dos|denial|regex|redos|resource|leak/.test(t))return 'erosion';                               // worn/melted
  return 'generic';
}
const detected=(x)=>x!=null&&(Array.isArray(x)?x.length>0:true);

// Synthetic v2 augmentation — DEMO SCAFFOLD ONLY. Runs at boot; for each v2 field NOT already
// present on the manifest, it fabricates a small, deterministic (hash-seeded, no Math.random)
// fixture using the EXACT real key names so the new layers are demonstrable today and swap to the
// data agent's real data the instant it lands (feature-detect wins; synthetic never overwrites).
// Everything it fabricates is tagged provenance:'synthetic' so the UI never implies it is scanned.
function augmentV2(m){
  const svcs=m.services||[];
  const relLeaves=(s)=>leavesOf(s.tree).map(n=>n.path).filter(Boolean);
  // 1) per-function span — only if no symbol already carries one
  const anySpan=svcs.some(s=>leavesOf(s.tree).some(n=>(n.symbols||[]).some(y=>y.span)));
  V2.span=anySpan;
  if(!anySpan){
    svcs.forEach((s,si)=>leavesOf(s.tree).forEach((n,ni)=>(n.symbols||[]).forEach((y,yi)=>{
      const len=6+Math.floor(hash01(si*131+ni*17+yi*7+1)*120); // 6..126 lines, deterministic
      y.span={startLine:y.line||1,endLine:(y.line||1)+len,synthetic:true};
    })));
  }
  // 2) service.wiring (func→func) 3) service.fileWiring (imports)
  svcs.forEach((s,si)=>{
    if(!detected(s.wiring)){
      const leaves=leavesOf(s.tree).filter(n=>(n.symbols||[]).length);
      const w=[];
      for(let k=0;k+1<leaves.length&&k<10;k++){
        const a=leaves[k],b=leaves[(k+1+((hash01(si*53+k)*3)|0))%leaves.length];
        const as=a.symbols[0],bs=b.symbols[(hash01(si*29+k)* b.symbols.length)|0]||b.symbols[0];
        if(a!==b&&as&&bs)w.push({from:{file:a.path,symbol:as.name},to:{file:b.path,symbol:bs.name},count:1+((hash01(si*7+k)*4)|0),synthetic:true});
      }
      if(w.length){s.wiring=w;}
    }else V2.wiring=true;
    if(!detected(s.fileWiring)){
      const paths=relLeaves(s);
      const fw=[];
      for(let k=0;k+1<paths.length&&k<14;k++){
        const b=paths[(k+2+((hash01(si*61+k)*5)|0))%paths.length];
        if(paths[k]!==b)fw.push({from:paths[k],to:b,count:1,synthetic:true});
      }
      if(fw.length){s.fileWiring=fw;}
    }else V2.fileWiring=true;
  });
  if(svcs.some(s=>s.wiring&&s.wiring.some(w=>!w.synthetic)))V2.wiring=true;
  if(svcs.some(s=>s.fileWiring&&s.fileWiring.some(w=>!w.synthetic)))V2.fileWiring=true;
  // 4) M.airBridges — secure svc→svc corridors, kind ∈ KIND_COLOR (grpc/amqp/kafka/oauth/client)
  if(!detected(m.airBridges)){
    const kinds=['grpc','amqp','kafka','oauth','client'];
    const ab=[];
    for(let i=0;i+1<svcs.length;i++){
      ab.push({from:svcs[i].id,to:svcs[(i+1)%svcs.length].id,kind:kinds[i%kinds.length],count:1+((hash01(i*97)*6)|0),secure:true,synthetic:true});
    }
    if(svcs.length>=3)ab.push({from:svcs[0].id,to:svcs[2].id,kind:'grpc',count:2,secure:true,synthetic:true});
    if(ab.length)m.airBridges=ab;
  }else V2.airBridges=true;
  // 5) node.logging + M.logSinks — mark ~1/3 of symbolled files as loggers draining to a sink svc
  const anyLog=svcs.some(s=>leavesOf(s.tree).some(n=>n.logging));
  V2.logging=anyLog||detected(m.logSinks);
  if(!anyLog){
    m.logSinks=m.logSinks||[{service:'__reporting__',label:'reporting / log aggregation',synthetic:true},
                            {service:'__audit__',label:'audit trail',audit:true,synthetic:true}];
    svcs.forEach((s,si)=>leavesOf(s.tree).forEach((n,ni)=>{
      if((n.symbols||[]).length&&hash01(si*211+ni*13)>0.66){
        n.logging={count:1+((hash01(si*3+ni)*20)|0),sink:'__reporting__',
          category:(hash01(si*17+ni*5)>0.8?'audit':'app'),synthetic:true};
      }
    }));
  }
  // 6) M.vulnerabilities — stacking demo: cluster several onto a few nodes (container/file/function)
  if(!detected(m.vulnerabilities)){
    const V=[];const push=(o)=>V.push(o);
    const pkgs=[['log4j-core','2.14.1','2.17.1','critical','Remote code execution via JNDI lookup (memory-unsafe deserialization)'],
      ['jackson-databind','2.9.10','2.13.4.2','high','Deserialization of untrusted data leads to RCE'],
      ['spring-security','5.6.1','5.6.9','critical','Authentication bypass in access-control chain (auth breach)'],
      ['openssl','1.1.1k','1.1.1n','high','Buffer overflow in certificate parsing (memory)'],
      ['lodash','4.17.15','4.17.21','medium','Prototype pollution (outdated dependency)'],
      ['express','4.16.0','4.19.2','medium','Open redirect — deprecated / outdated version'],
      ['axios','0.21.0','1.6.0','high','SSRF via unvalidated redirect (injection)'],
      ['netty','4.1.50','4.1.86','high','Request smuggling — memory handling of chunked bodies']];
    svcs.forEach((s,si)=>{
      // one container-scoped vuln per service (targets the image)
      const p=pkgs[si%pkgs.length];
      push({id:`CVE-2026-${1000+si}`,severity:p[3],target:{scope:'container',ref:s.id},pkg:p[0],installed:p[1],fixed:p[2],title:p[4],source:s.container&&s.container.baseImage||'image',provenance:'synthetic'});
      // stack 0..3 file/function vulns on the busiest files (deterministic)
      const leaves=leavesOf(s.tree).filter(n=>(n.symbols||[]).length);
      const nStack=1+((hash01(si*41)* 2.999)|0);  // 1..3 so every service stacks ≥1 file/fn vuln
      for(let k=0;k<nStack&&k<leaves.length;k++){
        const n=leaves[(k*3+si)%leaves.length];const q=pkgs[(si+k+1)%pkgs.length];
        const sym=n.symbols[(hash01(si*7+k*5)*n.symbols.length)|0];
        // alternate scope deterministically so file- AND function-scoped glows are both demonstrable
        // (k=0 → file scope, always resolvable; odd k → function scope when a symbol exists)
        const onFn=(k%2===1)&&sym;
        push({id:`CVE-2026-${2000+si*10+k}`,severity:q[3],
          target:onFn?{scope:'function',ref:{file:n.path,symbol:sym.name}}:{scope:'file',ref:n.path,service:s.id},
          pkg:q[0],installed:q[1],fixed:q[2],title:q[4],source:n.path,provenance:'synthetic',
          service:s.id});
      }
    });
    // a CHAIN: link three vulns so hover draws connecting seams (how the exploit connects)
    if(V.length>=4){const chain=[V[0].id,V[2].id,V[V.length-1].id];
      [V[0],V[2],V[V.length-1]].forEach(v=>v.chain=chain.filter(id=>id!==v.id));}
    if(V.length)m.vulnerabilities=V;
  }else V2.vuln=true;
  return m;
}

// ── 6 themes = presets over ONE scene graph (F6). layout: treemap | radial ────────────────────
// down-selected 2026-07-20 from the 6-theme demo round: City / Organic / Glass kept, Organic
// static. + Monolith (07-20): the whole repo as ONE megalith — flat black-glass faces, glowing
// apertures where the code opens to the world (endpoints/sockets/brokers/datastores), the file
// constellation dimly visible inside. Sprawl-deck styling: void, neon, grid horizon, slow drift.
const THEMES={
  city:     {label:'City',     layout:'treemap', bg:0x1a1d24, fog:[0x1a1d24,.0022], ground:'plane', groundColor:0x22262f,
             mat:'lambert', sat:0, light:0, dirColor:0x2e3440, lineColor:0x3b4252, autoRotate:0, camY:.55,
             dark:true, svcInk:'#e8edf5', svcInkDim:'#8a93a3'},
  organic:  {label:'Organic',  layout:'radial',  bg:0x101408, fog:[0x101408,.002], ground:'plane', groundColor:0x161c0c,
             mat:'lambert', sat:.1, light:.02, dirColor:0x6a7f3f, lineColor:0x55632f, autoRotate:0, camY:.6, cone:true,
             dark:true, svcInk:'#e8edf5', svcInkDim:'#8a93a3'},
  glass:    {label:'Glass',    layout:'treemap', bg:0xe8ecf3, fog:[0xe8ecf3,.0015], ground:'plane', groundColor:0xdde3ee,
             mat:'glass', sat:-.05, light:.12, dirColor:0xc3ccdd, lineColor:0xb8c2d6, autoRotate:0, camY:.6, dark:false,
             svcInk:'#25314a', svcInkDim:'#555f78'},
  monolith: {label:'Monolith', layout:'monolith', bg:0x000003, fog:[0x000003,.0007], autoRotate:.18, camY:.42,
             dark:true, grid:[0x004b5a,0x00161d], hud:'#3fd9e8', hudDim:'#2a8c96'},
  // Noir (07-23): the v2 analytics theme. Blacker ground (#000000 @ .85, VARIABLE transparency:
  // more transparent over dense/clean districts, more opaque elsewhere), tuned so CVE glows, air
  // bridges, roads and the sub-floor sewer read cleanly against near-black. Treemap layout so the
  // city floorplan carries the wiring + envelopes. All v2 interior layers default-on here.
  noir:     {label:'Noir',     layout:'treemap', bg:0x05070b, fog:[0x05070b,.0018], ground:'noir', groundColor:0x000000,
             mat:'lambert', sat:0, light:.04, dirColor:0x151b26, lineColor:0x1b2430, autoRotate:0, camY:.62, dark:true, v2default:true,
             floor:0x000000, svcInk:'#e8edf5', svcInkDim:'#8a93a3'},
  // Megalith (07-23): EXTERIOR view #1 — the codebase-as-city seen from OUTSIDE as one obsidian
  // slab. Faces are glass-smooth where clean; wherever M.vulnerabilities target a service, the face
  // ERUPTS into a fault whose CHARACTER is keyed to vuln TYPE (memory→jagged crack, outdated→
  // corrosion, auth→breach/hole, injection→fracture, dos→erosion). Reuses buildMonolith (one graph),
  // adds an exterior-faults pass. See EXTERIOR-VIEWS.md for the full 6-concept design.
  megalith: {label:'Megalith', layout:'monolith', bg:0x000003, fog:[0x000003,.0006], autoRotate:.12, camY:.44, exterior:true,
             dark:true, grid:[0x004b5a,0x00161d], hud:'#3fd9e8', hudDim:'#2a8c96'},
};
// Each view in the other mode: overrides merged over THEMES, the view's native mode left empty.
// Glass is natively light. Monolith and Megalith keep their obsidian slab in light mode, standing on
// a pale ground: the apertures and vulnerability faults are drawn on the slab, and they read there.
const SCENE_LIGHT={bg:0xe9e7e1,dark:false,svcInk:'#1f2937',svcInkDim:'#545c69'};
const SLAB_LIGHT={bg:0xe6eaee,dark:false,grid:[0x7f96a0,0xc3cdd4],hud:'#0b5563',hudDim:'#466870'};
const THEME_MODES={
  // a light scene is lit at about 1.3x, so its ground and district colours sit that far below the
  // paper they should render as
  city:    {dark:{}, light:{...SCENE_LIGHT,fog:[0xe9e7e1,.0022],groundColor:0xaba9a3,dirColor:0x9f9b90,lineColor:0x9c998e,light:-.06}},
  organic: {dark:{}, light:{...SCENE_LIGHT,bg:0xeef0e4,fog:[0xeef0e4,.002],groundColor:0xb0b3a3,dirColor:0x8d9a68,lineColor:0x7d8c4e,light:-.06}},
  glass:   {light:{}, dark:{bg:0x0e1422,fog:[0x0e1422,.0015],groundColor:0x151d2e,dirColor:0x2a3650,lineColor:0x3a4863,dark:true,
            svcInk:'#e8edf5',svcInkDim:'#8a93a3'}},
  monolith:{dark:{}, light:{...SLAB_LIGHT,fog:[0xe6eaee,.0007]}},
  noir:    {dark:{}, light:{...SCENE_LIGHT,bg:0xf1f1ef,fog:[0xf1f1ef,.0018],floor:0xffffff,dirColor:0xd5d7db,lineColor:0xbfc4cb,light:-.04}},
  megalith:{dark:{}, light:{...SLAB_LIGHT,fog:[0xe6eaee,.0006]}},
};
const themeFor=(k,mode)=>Object.assign({},THEMES[k],THEME_MODES[k]&&THEME_MODES[k][mode]);
// Layer colours that depend only on whether the ground is light. neon: the lightness shift that keeps
// an I/O-kind neon visible on a light ground.
const MODE_LAYER={
  dark: {road:0xe8b04b,roadDash:0xfff2c8,wiring:0x4fd4ff,hullEdge:0x86b0e6,hullInk:'#9cc4f5',sewer:[0x2a3a44,0x3a6e7a,0x8a5cff],sewerGrid:[0x14202a,0x0c151c],
         chain:0xff3355,neon:0,sev:SEV_COLOR,sevUnknown:SEV_UNKNOWN},
  light:{road:0xa86f0c,roadDash:0x6b5214,wiring:0x0e7fa6,hullEdge:0x3d6ea8,hullInk:'#2f5f96',sewer:[0x7a8a94,0x2f6b78,0x6a3fd9],sewerGrid:[0xb8c2ca,0xd6dde2],
         chain:0xd0103a,neon:-.22,sev:SEV_COLOR_LIGHT,sevUnknown:SEV_UNKNOWN_LIGHT},
};
// aperture styling — kind -> [w,h] within a facade cell, and its neon
const KIND_STYLE={http:[4.6,1.1],socket:[2.6,2.6],ws:[2.2,2.2],grpc:[2.6,1.6],amqp:[1.6,3.2],kafka:[1.6,3.2],
  jdbc:[3.2,1.6],redis:[1.8,1.8],consul:[1.6,1.6],oauth:[2.0,2.0],client:[1.2,2.4],external:[1.2,1.2],more:[4.6,.8]};
const KIND_COLOR={http:'#00e5ff',socket:'#f2f7ff',ws:'#7df9ff',grpc:'#4f8ef7',amqp:'#ff2bd6',kafka:'#ff8a00',
  jdbc:'#ffb300',redis:'#ff3b30',consul:'#b06bff',oauth:'#3ddc84',client:'#9adcff',external:'#ff9db4',more:'#5c6576'};
const KIND_LABEL={http:'HTTP endpoint',socket:'socket / port',ws:'websocket',grpc:'gRPC service',amqp:'AMQP',
  kafka:'Kafka',jdbc:'JDBC',redis:'Redis',consul:'Consul',oauth:'OAuth / IdP',client:'outbound client',external:'external links',more:'overflow'};

// ── PALETTE — style-token mediator (B2) ─────────────────────────────────────────────────────────
// ADDITIVE, non-destructive. The four maps above (LANG_COLOR / SEV_COLOR / KIND_* / THEMES) stay the
// single source of truth for their concern; PALETTE is the ONE indirection the render code reads
// colour/style through, so (1) a theme can retint a whole family in one place, (2) a11y/semantic
// tokens have a home, and (3) NEW families (e.g. access-control state, below) live beside the old
// ones instead of as loose literals sprinkled through the builders. It WRAPS the tables — it does
// not replace them; every existing consumer keeps working byte-for-byte (langColor/SEV_COLOR/KIND_*
// are still referenced directly where they already were). New code SHOULD go through PALETTE.
const PALETTE={
  lang: LANG_COLOR,                          // file-box colour by language (see langColor())
  sev:  SEV_COLOR,                           // CVE-glow colour by severity
  kind: { style:KIND_STYLE, color:KIND_COLOR, label:KIND_LABEL },  // I/O aperture geometry+neon+tooltip
  // ACCESS-CONTROL state (B2 foundation for feature c — black-glass blocked/bypassed I/O sheets).
  // These are the ONLY home for the new "access" visual family; the render layer reads them, never

// ── placementPolicy — semantic service ordering (B3) ────────────────────────────────────────────
// ADDITIVE. All three layout engines (treemap/radial/monolith) place services in `services` ARRAY
// ORDER — treemap row-wraps in order, radial assigns sectors in order, monolith walks the perimeter
// in order. So semantic placement needs no packer rewrite: we return a REORDERED COPY of the array,
// consumed unchanged by every engine. The ordering realises the backlog intent —
//   internal (talks to nobody outside)      → LOW score  → placed first → interior / early sectors
//   interfacing (broker/db/cache clients)   → MID score  → cluster band
//   external-facing (http/grpc/oauth/ws in) → HIGH score → last → perimeter / prominent faces
// FEATURE-DETECTED and honest: a service with no io[] scores 0 (neutral) and the order collapses to

// then original index) so equal-score services keep their manifest order (deterministic rebuilds).

  if(LAYERS.bridges)    buildAirBridges(L,T);
  if(LAYERS.glows)      buildGlows(L,T);
  if(LAYERS.access)     buildAccessSheets(L); // c: black-glass blocked/bypassed I/O sheets (all themes; reads best in Noir)
  // service HTML labels (3 only — cheap per-frame projection)
  for(const a of L.svcAnchors){
    const el=document.createElement('div');el.className='svclabel';
    const lc=a.svc.lifecycle;
    el.style.color=lc?T.svcInkDim:T.svcInk;
    el.textContent=a.svc.name+(lc==='superseded'?' · standby':lc==='retired'?' · retired':'');
    keyLabel(el,()=>{frameService(a.svc);showService(a.svc);});
    stage.appendChild(el);
    // Pin the label over the item's CENTRE, not the anchor. The svcAnchor (a.x/a.z) sits OUTSIDE the
    // district by design, which made labels hover off-axis. posIndex.svc holds the district centroid
    // (mean of the service's files); project from THAT so the centre-aligned text (CSS translate
    // -50%,-100%) sits directly above the item's Z-centre and stays pinned there through map rotation.
    const c=(posIndex&&posIndex.svc&&posIndex.svc.get(a.svc.id))||{x:a.x,z:a.z};
    svcLabels.push({el,pos:new THREE.Vector3(c.x,T.layout==='treemap'?10:4,c.z)});
  }
  animate();
}

// ── v2 interior layers ─────────────────────────────────────────────────────────────────────────
// Shared bookkeeping: index file + service positions so edge/glow layers can resolve refs by
// (service, path) and (service). Files carry footprint (w/d) + top-of-box y for stacking.
function buildPosIndex(L){
  posIndex={file:new Map(),svc:new Map(),svcOf:new Map(),files:L.files};
  for(const f of L.files){
    const key=f.svc.id+'\0'+(f.node.path||f.node.name);
    posIndex.file.set(key,{x:f.x,y:f.y,z:f.z,w:f.w,h:f.h,d:f.d,top:f.y+f.h/2,node:f.node,svc:f.svc});
  }
  for(const a of L.svcAnchors){
    // service floor centroid = mean of its files (anchors sit outside the district for labels)
    const fs=L.files.filter(f=>f.svc===a.svc);
    const cx=fs.length?fs.reduce((s,f)=>s+f.x,0)/fs.length:a.x;
    const cz=fs.length?fs.reduce((s,f)=>s+f.z,0)/fs.length:a.z;
    posIndex.svc.set(a.svc.id,{x:cx,z:cz,svc:a.svc,files:fs});
  }
}
const fileAt=(svcId,path)=>posIndex&&posIndex.file.get(svcId+'\0'+path);
// resolve a v2 wiring endpoint {file,symbol} or bare path within a service → world position
function endpointPos(svcId,ep){
  if(!ep)return null;
  const path=typeof ep==='string'?ep:ep.file;
  const p=fileAt(svcId,path);if(!p)return null;
  // sub-offset by symbol so multiple roads from one file don't perfectly overlap
  if(ep&&ep.symbol){const h=hash01(hashStr(ep.symbol));return {x:p.x+(h-.5)*p.w*.6,y:.4,z:p.z+(hash01(hashStr(ep.symbol)+1)-.5)*p.d*.6};}
  return {x:p.x,y:.4,z:p.z};
}
function hashStr(s){let h=2166136261;s=String(s);for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function heurMat(color,opacity,dashed){
  // synthetic/heuristic layers render translucent (and callers may add dashing) so the map never
  // implies parsed certainty it doesn't have — honest-provenance styling.
  return new THREE.LineBasicMaterial({color,transparent:true,opacity});
}

// LAYER 2 — ROADS: service.wiring (func→func call edges) as thick two-way road ribbons on the floor.
// Two offset lanes (a double line) = permanent both-directions styling. Solid-ish (parsed edges) vs
// translucent (synthetic). Drawn just above the floor to avoid z-fighting.
function buildRoads(L){
  const svcs=M.services||[];if(!svcs.some(s=>detected(s.wiring)))return;
  const lanesA=[],lanesB=[],col=[];let synthetic=false;const c=new THREE.Color();
  for(const s of svcs){
    for(const w of (s.wiring||[])){
      if(w.synthetic)synthetic=true;
      const a=endpointPos(s.id,w.from),b=endpointPos(s.id,w.to);if(!a||!b)continue;
      // real wiring names the sighting count `weight`; synthetic uses `count`. Heavier call-paths
      // get a wider carriageway so a hot edge reads as a bigger highway.
      const wt=w.weight!=null?w.weight:(w.count!=null?w.count:1),lane=.5+Math.min(1.4,Math.log2(1+wt)*.5);
      const dx=b.x-a.x,dz=b.z-a.z,len=Math.hypot(dx,dz)||1,ox=-dz/len*lane,oz=dx/len*lane; // lane offset ⟂
      const y=.5;
      lanesA.push(a.x+ox,y,a.z+oz, b.x+ox,y,b.z+oz);
      lanesB.push(a.x-ox,y,a.z-oz, b.x-ox,y,b.z-oz);
      c.set(lp().road);for(let i=0;i<4;i++)col.push(c.r,c.g,c.b); // amber highway
    }
  }
  if(!lanesA.length)return;
  const mk=(arr)=>{const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(arr),3));
    return new THREE.LineSegments(g,new THREE.LineBasicMaterial({color:lp().road,transparent:true,opacity:synthetic?.5:.85,linewidth:2}));};
  const gA=mk(lanesA),gB=mk(lanesB);gA.renderOrder=1;gB.renderOrder=1;
  gA.userData.layer='roads';gB.userData.layer='roads';scene.add(gA);scene.add(gB);
  // centre dashes to read as a two-way carriageway
  const dash=[];for(let i=0;i<lanesA.length;i+=6){const ax=(lanesA[i]+lanesB[i])/2,az=(lanesA[i+2]+lanesB[i+2])/2,bx=(lanesA[i+3]+lanesB[i+3])/2,bz=(lanesA[i+5]+lanesB[i+5])/2;
    for(let t=0;t<1;t+=.28){dash.push(ax+(bx-ax)*t,.52,az+(bz-az)*t, ax+(bx-ax)*(t+.14),.52,az+(bz-az)*(t+.14));}}
  const dg=new THREE.BufferGeometry();dg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(dash),3));
  const dl=new THREE.LineSegments(dg,new THREE.LineBasicMaterial({color:lp().roadDash,transparent:true,opacity:synthetic?.35:.7}));
  dl.renderOrder=2;dl.userData.layer='roads';scene.add(dl);
}

// LAYER 3 — WIRING: service.fileWiring (import edges) as thin lines between file positions. Visually
// distinct from roads (thin, cool cyan, single line, elevated slightly less). Dashed-look via short
// segments when synthetic.
function buildFileWiring(L){
  const svcs=M.services||[];if(!svcs.some(s=>detected(s.fileWiring)))return;
  const seg=[];let anySynthetic=false;
  for(const s of svcs){
    for(const w of (s.fileWiring||[])){
      // v2 real keys are fromPath/toPath; synthetic fallback uses from/to — accept either
      const fp=w.fromPath!=null?w.fromPath:w.from, tp=w.toPath!=null?w.toPath:w.to;
      const a=fileAt(s.id,fp),b=fileAt(s.id,tp);if(!a||!b)continue;
      if(w.synthetic){anySynthetic=true; // stitch as dashes to look heuristic
        const n=5;for(let i=0;i<n;i+=1){const t0=i/n,t1=(i+.5)/n;
          seg.push(a.x+(b.x-a.x)*t0,a.top+.3,a.z+(b.z-a.z)*t0, a.x+(b.x-a.x)*t1,b.top+.3,a.z+(b.z-a.z)*t1);}
      }else seg.push(a.x,a.top+.3,a.z, b.x,b.top+.3,b.z);
    }
  }
  if(!seg.length)return;
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(seg),3));
  const l=new THREE.LineSegments(g,new THREE.LineBasicMaterial({color:lp().wiring,transparent:true,opacity:anySynthetic?.32:.6}));
  l.renderOrder=1;l.userData.layer='wiring';scene.add(l);
}

// LAYER 7 — ACCESS SHEETS (feature c): render each io[].access verdict as a SHEET OF BLACK GLASS
// standing at its service, facing outward. Obsidian + near-opaque when blocked; a bypassed/defeated
// control glows at its edge (PALETTE.access[state].edge). A one-directional verdict (partial) is
// LIGHTER on its open side and gets a classical cone+cylinder ARROW punched through the sheet in the
// open direction. Feature-detected: no io[].access anywhere → no-op (every real fleet manifest today,
// until CWS-11 boots+probes). Additive; userData.layer='access' for the toggle. Inline arrow geometry
// (demo.html has no shared arrow idiom — d builds its own separately, by design).
function buildAccessSheets(L){
  const svcs=M.services||[];
  // gather (svc, io) pairs that carry an access verdict
  const items=[];
  for(const s of svcs) for(const e of (s.io||[])) if(e&&e.access&&e.access.status) items.push({svc:s,io:e});
  if(!items.length) return;                                 // honest no-op — nothing probed
  const grp=new THREE.Group(); grp.userData.layer='access';
  const up=new THREE.Vector3(0,1,0);
  items.forEach(({svc,io},idx)=>{
    const st=io.access.status, tok=paletteAccess(st);
    const pos=posIndex&&posIndex.svc&&posIndex.svc.get(svc.id); if(!pos) return;
    // stack multiple sheets for one service so they don't z-fight: fan along +x by index-within-svc
    const localN=items.filter(x=>x.svc===svc).indexOf(items[idx]);
    const px=pos.x+(localN- (items.filter(x=>x.svc===svc).length-1)/2)*7;
    const H=16, Wd=10, y=H/2+1;
    // the sheet — a thin box of black glass. opacity/colour from the PALETTE token.
    const sheet=new THREE.Mesh(new THREE.BoxGeometry(Wd,H,.5),
      new THREE.MeshPhongMaterial({color:tok.glass,transparent:true,opacity:tok.opacity,shininess:110,specular:0x2a3550,depthWrite:false}));
    sheet.position.set(px,y,pos.z);
    // 'partial' (one-directional): make the OPEN side visibly lighter — a second, fainter half-plane.
    if(st==='partial'){
      const open=new THREE.Mesh(new THREE.BoxGeometry(Wd,H/2,.5),
        new THREE.MeshPhongMaterial({color:tok.glass,transparent:true,opacity:Math.max(.12,tok.opacity*.4),shininess:110,specular:0x2a3550,depthWrite:false}));
      open.position.set(px,y+H/4,pos.z+.01); grp.add(open);   // upper half lighter = the open direction
    }
    // glowing edge frame — severity/bypass read (PALETTE edge colour).
    const edge=new THREE.LineSegments(new THREE.EdgesGeometry(sheet.geometry),
      new THREE.LineBasicMaterial({color:tok.edge,transparent:true,opacity:.9}));
    edge.position.copy(sheet.position); grp.add(sheet); grp.add(edge);
    sheet.userData.access={svc,io}; // hoverable payload (same convention as other layers)
    // one-directional arrow: classical cone(head)+cylinder(shaft) punched through the sheet.
    if(st==='partial'||io.access.direction==='inbound'||io.access.direction==='outbound'){
      const aTok=PALETTE.access.arrow;
      // tint by severity: cross-tenant-write (hot red, loudest) > blocked (red-orange) > default (magenta)
      const shaftCol=st==='cross-tenant-write'?aTok.writeShaft:st==='blocked'?aTok.blockedShaft:aTok.shaft;
      const headCol =st==='cross-tenant-write'?aTok.writeHead :st==='blocked'?aTok.blockedHead :aTok.head;
      const outward=(io.access.direction==='outbound'); // outbound points away from centre (+z), inbound toward (−z)
      const dir=new THREE.Vector3(0,0,outward?1:-1);
      const arrow=new THREE.Group();
      const shaft=new THREE.Mesh(new THREE.CylinderGeometry(.35,.35,7,12),
        new THREE.MeshPhongMaterial({color:shaftCol,emissive:shaftCol,emissiveIntensity:.35}));
      const head=new THREE.Mesh(new THREE.ConeGeometry(1.0,2.4,16),
        new THREE.MeshPhongMaterial({color:headCol,emissive:headCol,emissiveIntensity:.5}));
      // classical style: shaft then cone tip, laid along -Z, then oriented to `dir`.
      shaft.position.set(0,0,0); head.position.set(0,0,-4.7); head.rotation.x=-Math.PI/2; shaft.rotation.x=Math.PI/2;
      arrow.add(shaft); arrow.add(head);
      arrow.position.set(px,y,pos.z); arrow.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,-1),dir);
      grp.add(arrow);
    }
  });
  if(grp.children.length) scene.add(grp);
}

// LAYER 1 — FUNCTIONS PER FILE, SIZED: explode a file's box into its functions (node.symbols[] with
// span). Each function = an evenly-footprinted sub-box, HEIGHT scaled by span (endLine-startLine),
// grid-stacked on top of the file footprint. One InstancedMesh across all files. The parent file box
// is left in place (dimmed) as the "plot"; functions rise from it. Hoverable → fnMeta.
function buildFunctionsExplode(L,T,bgCol){
  const boxes=[];fnMeta=[];const c=new THREE.Color();
  for(const f of L.files){
    const syms=(f.node.symbols||[]).filter(y=>y.type==='function'||y.type==='class'||y.type==='model');
    if(!syms.length)continue;
    const cols=Math.ceil(Math.sqrt(syms.length)),rows=Math.ceil(syms.length/cols);
    const cw=f.w/cols,cd=f.d/rows,pad=.72;
    syms.forEach((y,j)=>{
      const span=y.span?Math.max(1,(y.span.endLine||0)-(y.span.startLine||0)):8;
      const h=1+Math.min(20,span*.14);                       // sized by span, clamped
      const gx=f.x-f.w/2+(j%cols)*cw+cw/2, gz=f.z-f.d/2+((j/cols)|0)*cd+cd/2;
      c.set(langColor(f.node.lang)).offsetHSL(0,.12,.14);
      boxes.push({x:gx,y:f.y+f.h/2+h/2,z:gz,w:Math.max(.35,cw*pad),h,d:Math.max(.35,cd*pad),col:c.clone(),node:f.node,svc:f.svc,sym:y});
    });
  }
  if(!boxes.length)return;
  fnMesh=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshLambertMaterial({}),boxes.length);
  const d=new THREE.Object3D();
  boxes.forEach((b,i)=>{d.position.set(b.x,b.y,b.z);d.scale.set(b.w,b.h,b.d);d.updateMatrix();fnMesh.setMatrixAt(i,d.matrix);
    fnMesh.setColorAt(i,b.col);fnMeta[i]={node:b.node,svc:b.svc,sym:b.sym};});
  fnMesh.instanceMatrix.needsUpdate=true;if(fnMesh.instanceColor)fnMesh.instanceColor.needsUpdate=true;
  fnMesh.userData.layer='functions';scene.add(fnMesh);
  // dim the parent file boxes so the exploded functions read as the foreground
  if(instMesh&&instMesh.instanceColor){const cc=new THREE.Color();
    for(let i=0;i<fileMeta.length;i++){instMesh.getColorAt(i,cc);cc.lerp(bgCol,.55);instMesh.setColorAt(i,cc);}
    instMesh.instanceColor.needsUpdate=true;}
}

// LAYER 4 — AIR BRIDGES: M.airBridges (secure svc→svc corridors) as elevated glowing arcs (up and
// over the floor, not on it), colour-coded by io kind (KIND_COLOR). Tube geometry along a quadratic
// arc. These are the "secure corridors for information exchange." Normal blending, and the core
// writes depth: where corridors cross, the nearer one hides the farther instead of summing to white.
function buildAirBridges(L,T){
  if(!detected(M.airBridges))return;
  for(const b of M.airBridges){
    const a=posIndex.svc.get(b.from);if(!a)continue;
    // real: resolved:bool + to:null for dangling; synthetic: secure + always a `to`. Accept both.
    const isResolved=b.resolved!=null?b.resolved:(b.secure!=null?b.secure:true);
    const z=b.to!=null?posIndex.svc.get(b.to):null;
    const col=new THREE.Color(KIND_COLOR[b.kind]||'#9adcff').offsetHSL(0,0,lp().neon);
    const p0=new THREE.Vector3(a.x,6,a.z);
    if(z&&z!==a){ // resolved svc→svc corridor: full arc
      const p2=new THREE.Vector3(z.x,6,z.z);
      const dist=p0.distanceTo(p2),lift=Math.max(24,dist*.42);
      const mid=new THREE.Vector3((a.x+z.x)/2,6+lift,(a.z+z.z)/2);
      const curve=new THREE.QuadraticBezierCurve3(p0,mid,p2);
      const op=b.synthetic?.5:.82;
      const tube=new THREE.Mesh(new THREE.TubeGeometry(curve,32,1.25,7,false),
        new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:op}));
      tube.renderOrder=5;tube.userData.layer='bridges';scene.add(tube);
      // halos draw after every core (renderOrder 6), so a core in front hides the halo behind it
      const halo=new THREE.Mesh(new THREE.TubeGeometry(curve,32,2.6,7,false),
        new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.14,depthWrite:false}));
      halo.renderOrder=6;halo.userData.layer='bridges';scene.add(halo);
    }else{ // self-edge (from===to) OR dangling (to:null / unresolved): a stub that arcs up and fades
      // into the void — honest "this corridor opens to something we couldn't place", never dropped.
      const up=z===a?18:Math.max(30,42);                       // self-loop shorter than a dangling reach
      const tip=z===a?new THREE.Vector3(a.x+10,6,a.z+10):new THREE.Vector3(a.x,6,a.z);
      const mid=new THREE.Vector3((a.x+tip.x)/2,6+up,(a.z+tip.z)/2);
      const curve=new THREE.QuadraticBezierCurve3(p0,mid,tip);
      const tube=new THREE.Mesh(new THREE.TubeGeometry(curve,24,z===a?1.0:.7,6,false),
        new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:isResolved?.5:.28}));
      tube.renderOrder=5;tube.userData.layer='bridges';scene.add(tube);
    }
  }
}

// LAYERS 5+6 — SEWER (reporting/logging) + AUDIT wiring. A sub-floor network BELOW ground (negative
// Y): every file with node.logging drops a riser to the sub-floor, then a dim pipe routes to a sink.
// Audit-category logs (node.logging.category==='audit', or oauth io endpoints) use a distinct colour.
function buildSewer(L,T){
  const svcs=M.services||[];
  const loggers=[];for(const f of L.files){if(f.node.logging)loggers.push(f);}
  const hasOAuth=svcs.some(s=>(s.io||[]).some(i=>i.kind==='oauth'));
  if(!loggers.length&&!hasOAuth)return;
  const FLOOR=-14;                       // sub-floor plane
  const risers=[],appPipe=[],auditPipe=[];
  // sink hubs: reporting hub at centre-ish, audit hub offset
  const repHub={x:0,y:FLOOR-4,z:0},audHub={x:0,y:FLOOR-4,z:Math.max(30,140)};
  // ── ORTHOGONAL (Manhattan) routing: pipes run along the sub-floor in right angles like real
  // utility trunks — NEVER a diagonal. From a drop point we run along ONE axis to the hub's line,
  // then along the other axis into the hub, then a short vertical drop into the sink node. Corridor
  // aggregation: every horizontal leg is snapped to a coarse grid and DEDUPED via a segment-key set,
  // so loggers that share a trunk collapse to one drawn segment (cheap; fewer LineSegments verts).
  const GRID=6;                          // corridor snap pitch (world units)
  const snap=(v)=>Math.round(v/GRID)*GRID;
  const seen={app:new Set(),audit:new Set()};     // per-pipe dedupe of shared corridor legs
  function ortho(tgt,bag,x0,z0,dst,zFirst){
    // emit an L-route from (x0,FLOOR,z0) to (dst.x,FLOOR,dst.z) as two axis-aligned legs, then the
    // vertical hub drop. `zFirst` picks Z-then-X vs X-then-Z so trunks fan onto distinct corridors.
    const cx=snap(x0),cz=snap(z0),hx=dst.x,hz=dst.z;
    const cornerX=zFirst?cx:hx, cornerZ=zFirst?hz:cz;   // the single right-angle bend point
    const legs=zFirst
      ? [[cx,cz, cx,cornerZ],[cx,cornerZ, hx,cornerZ]]  // run Z first (fixed X), then X into hub
      : [[cx,cz, cornerX,cz],[cornerX,cz, cornerX,hz]]; // run X first (fixed Z), then Z into hub
    for(const[ax,az,bx,bz]of legs){
      if(ax===bx&&az===bz)continue;                     // zero-length leg (already on the corridor)
      const key=ax+','+az+'|'+bx+','+bz, rkey=bx+','+bz+'|'+ax+','+az;
      if(bag.has(key)||bag.has(rkey))continue;          // this exact corridor already drawn
      bag.add(key);
      tgt.push(ax,FLOOR,az, bx,FLOOR,bz);               // horizontal leg on the sub-floor plane
    }
    const dkey='drop|'+hx+','+hz;                       // shared vertical hub drop — draw once
    if(!bag.has(dkey)){bag.add(dkey);tgt.push(hx,FLOOR,hz, dst.x,dst.y,dst.z);}
  }
  for(const f of loggers){
    const audit=f.node.logging&&f.node.logging.category==='audit';
    const dst=audit?audHub:repHub, tgt=audit?auditPipe:appPipe, bag=audit?seen.audit:seen.app;
    risers.push(f.x,f.y-f.h/2,f.z, f.x,FLOOR,f.z);                 // drop through the floor
    // deterministic axis choice (no Math.random) so trunks aggregate onto stable corridors — some
    // loggers route Z-then-X, others X-then-Z, so the network reads as branching trunks, not a star.
    const zFirst=hash01(hashStr((f.node.path||f.node.name)+'#sewer'))>0.5;
    ortho(tgt,bag,f.x,f.z,dst,zFirst);                            // right-angle route to sink
  }
  // AUDIT-as-wiring fallback: if logging isn't marked audit, treat oauth io as audit endpoints —
  // draw an audit pipe from each service centroid emitting oauth down to the audit hub (orthogonal).
  if(!auditPipe.length){
    for(const s of svcs){if((s.io||[]).some(i=>i.kind==='oauth')){const c=posIndex.svc.get(s.id);if(c){
      risers.push(c.x,.2,c.z, c.x,FLOOR,c.z);
      ortho(auditPipe,seen.audit,c.x,c.z,audHub,hash01(hashStr(s.id+'#sewer'))>0.5);}}}
  }
  const addLines=(arr,color,op)=>{if(!arr.length)return;const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(arr),3));
    const l=new THREE.LineSegments(g,new THREE.LineBasicMaterial({color,transparent:true,opacity:op}));
    l.userData.layer='sewer';l.renderOrder=0;scene.add(l);};
  const [riserCol,appCol,auditCol]=lp().sewer;
  addLines(risers,riserCol,.4);            // dim grey risers
  addLines(appPipe,appCol,.5);             // reporting pipes — dim teal
  addLines(auditPipe,auditCol,.6);         // AUDIT pipes — distinct violet (auditing-as-wiring)
  // sink node markers
  [[repHub,appCol],[audHub,auditCol]].forEach(([h,cl])=>{
    if((h===repHub&&!appPipe.length)||(h===audHub&&!auditPipe.length))return;
    const s=new THREE.Mesh(new THREE.OctahedronGeometry(4),new THREE.MeshBasicMaterial({color:cl,transparent:true,opacity:.55,depthWrite:false}));
    s.position.set(h.x,h.y,h.z);s.userData.layer='sewer';scene.add(s);});
  // faint sub-floor grid so the sewer reads as a distinct plane
  const gh=new THREE.GridHelper(Math.max(400,span2(L)),40,lp().sewerGrid[0],lp().sewerGrid[1]);gh.position.y=FLOOR;gh.userData.layer='sewer';scene.add(gh);
}
function span2(L){let e=60;for(const f of L.files){const a=Math.max(Math.abs(f.x),Math.abs(f.z));if(a>e)e=a;}return e*2.2;}

// LAYER 9 — CONTAINERS FOR A FLEET: translucent hull grouping the files that share a container/image.
// Grouped by service.container image identity (image||baseImage||dockerfile) so several services on
// one base share an envelope. Label = the image. Honest: dashed edges (grouping is inferred).
function containerKey(s){const c=s.container||{};return c.image||c.baseImage||c.composeService||c.dockerfile||('svc:'+s.id);}
function buildContainers(L,T){
  const groups=new Map();
  for(const s of (M.services||[])){const k=containerKey(s);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(s);}
  containerLabels=[];
  for(const [key,svcs] of groups){
    const fs=L.files.filter(f=>svcs.includes(f.svc));if(!fs.length)continue;
    let x0=1e9,x1=-1e9,z0=1e9,z1=-1e9,y1=0;
    for(const f of fs){x0=Math.min(x0,f.x-f.w/2);x1=Math.max(x1,f.x+f.w/2);z0=Math.min(z0,f.z-f.d/2);z1=Math.max(z1,f.z+f.d/2);y1=Math.max(y1,f.y+f.h/2);}
    const pad=4;x0-=pad;x1+=pad;z0-=pad;z1+=pad;const h=Math.max(6,y1+4);
    const cx=(x0+x1)/2,cz=(z0+z1)/2,w=x1-x0,d=z1-z0;
    const hull=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),
      new THREE.MeshBasicMaterial({color:0x5b7fb0,transparent:true,opacity:.06,depthWrite:false}));
    hull.position.set(cx,h/2,cz);hull.userData.layer='containers';hull.renderOrder=0;scene.add(hull);
    const edges=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(w,h,d)),
      new THREE.LineBasicMaterial({color:lp().hullEdge,transparent:true,opacity:.4}));
    edges.position.set(cx,h/2,cz);edges.userData.layer='containers';scene.add(edges);
    // label with the image at the hull's top corner
    const el=document.createElement('div');el.className='svclabel mono';el.style.color=lp().hullInk;
    el.textContent='▣ '+shortImage(key);
    stage.appendChild(el);
    svcLabels.push({el,pos:new THREE.Vector3(cx,h+3,cz)});
  }
}
function shortImage(k){k=String(k);const at=k.indexOf('@');if(at>0)k=k.slice(0,at);const sl=k.lastIndexOf('/');return sl>0?k.slice(sl+1):k;}
let containerLabels=[];

// LAYER 8 — CVE STACKING GLOWS: one glow per vulnerability, STACKED (concentric additive halos) on
// the node it targets (container→DISTRIBUTED across the service's own files, keyed by pkg / file→file
// box / function→sub-box). Severity → colour (critical dark-red, high orange, medium yellow). Multiple
// vulns that land on the same node bloom brighter. NOTE the container change (feature 1): image CVEs
// used to ALL stack at the service centroid = one giant halo AROUND the service (the reported "global
// glow round buildout"); they now spread as many small glows ON the service's structure — see
// vulnAnchor()'s container branch. Registered in glowNodes for hover + chain lines (how it connects).
function radialGlowTexture(){
  if(radialGlowTexture._t)return radialGlowTexture._t;
  const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');
  const gr=g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.35,'rgba(255,255,255,.55)');gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr;g.fillRect(0,0,64,64);const t=keepTexture(new THREE.CanvasTexture(c));return radialGlowTexture._t=t;
}
function vulnAnchor(v){
  const t=v.target||{};
  if(t.scope==='container'){
    // real v2: target.ref is an IMAGE STRING and target.service names the owning service;
    // synthetic fallback puts the service id directly in ref. Prefer target.service, then ref.
    const svcId=t.service||v.service||t.ref;
    const c=posIndex.svc.get(svcId);if(!c)return null;
    // DISTRIBUTE, don't blob (fix the "global glow round buildout"). An image CVE has no source line,
    // but stacking EVERY infra-image CVE at the service centroid makes one giant halo AROUND the
    // buildout. Instead land each container CVE ON one of the service's OWN files — the parts that
    // ship in that image — chosen DETERMINISTICALLY by pkg name (no Math.random). Distinct pkgs →
    // distinct small glows spread across the service's footprint = many small glows showing WHERE.
    const files=(c.files&&c.files.length)?c.files:null;
    const seed=hashStr((v.pkg||v.id||'')+'\0'+svcId);          // stable per (pkg,service)
    if(files){
      const f=files[seed%files.length];                        // pick one of the service's files
      // small jitter within that file's own footprint so two pkgs on the same file don't perfectly
      // overlap, keyed by a second hash of the pkg — still fully deterministic.
      const jx=(hash01(seed)-.5), jz=(hash01(seed+7)-.5);
      return {x:f.x+jx*Math.max(2,f.w)*.8,y:(f.y+f.h/2)+3,z:f.z+jz*Math.max(2,f.d)*.8,r:5};
    }
    // no files placed for this service (shouldn't happen) — small jittered ring around the centroid,
    // still distinct per pkg, never one big centre sphere.
    const ang=hash01(seed)*Math.PI*2, rad=6+hash01(seed+3)*10;
    return {x:c.x+Math.cos(ang)*rad,y:6,z:c.z+Math.sin(ang)*rad,r:5};}
  if(t.scope==='file'){const svcId=t.service||(v.service)||guessSvc(t.ref);const p=fileAt(svcId,typeof t.ref==='string'?t.ref:t.ref.file);return p?{x:p.x,y:p.top+2,z:p.z,r:6}:null;}
  if(t.scope==='function'){const ref=t.ref||{};const svcId=t.service||v.service||guessSvc(ref.file);const p=fileAt(svcId,ref.file);
    if(!p)return null;const h=hash01(hashStr(ref.symbol||''));return {x:p.x+(h-.5)*p.w*.5,y:p.top+3,z:p.z+(hash01(hashStr(ref.symbol||'')+9)-.5)*p.d*.5,r:4};}
  return null;
}
// The service vulnAnchor resolved the vulnerability to, by the same precedence per scope.
function vulnSvcId(v){
  const t=v.target||{};
  if(t.scope==='container')return t.service||v.service||t.ref||null;
  if(t.scope==='file')return t.service||v.service||guessSvc(t.ref);
  if(t.scope==='function')return t.service||v.service||guessSvc((t.ref||{}).file);
  return null;
}
function guessSvc(ref){ // last-ditch: find which service owns a bare path
  if(!posIndex)return null;const path=typeof ref==='string'?ref:ref&&ref.file;
  for(const [k] of posIndex.file){if(k.endsWith('\0'+path))return k.split('\0')[0];}return null;
}
// Screen-sized (sizeAttenuation off) so the label stays legible at any zoom; not pulsed.
function sevTagSprite(sev,n){
  const c=document.createElement('canvas');c.width=128;c.height=44;const g=c.getContext('2d');
  g.fillStyle='rgba(13,17,23,.88)';g.fillRect(0,0,128,44);
  g.fillStyle='#'+sevColor(sev).toString(16).padStart(6,'0');g.font='bold 24px system-ui,sans-serif';
  g.textAlign='center';g.textBaseline='middle';g.fillText(sevLabel(sev)+(n>1?' ×'+n:''),64,23);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthWrite:false,depthTest:false,sizeAttenuation:false}));

}
function buildGlows(L,T){
  if(!detected(M.vulnerabilities))return;
  glowNodes=[];glowByVulnId={};
  const byKey=new Map(); // stack vulns that resolve to the same node
  for(const v of M.vulnerabilities){
    const a=vulnAnchor(v);if(!a)continue;
    const key=Math.round(a.x)+','+Math.round(a.y)+','+Math.round(a.z);
    let e=byKey.get(key);if(!e){e={key,pos:new THREE.Vector3(a.x,a.y,a.z),r:a.r,vulns:[],sprites:[],svcIds:new Set()};byKey.set(key,e);glowNodes.push(e);}
    e.vulns.push(v);glowByVulnId[v.id]=e;
    const sid=vulnSvcId(v);if(sid)e.svcIds.add(sid);
  }
  for(const e of glowNodes){
    // Shape-mapped severity marker — SMALL and CONTAINED, so you can still see everything around it.
    // (Was: stacked additive Sprite halos scaled e.r*(2.0+i*0.9) + a bright core = a bonfire that washed
    //  out its surroundings.) Now: one compact glowing box sized to the node footprint (e.r is a per-file
    //  radius ~5) marking WHICH component is affected, with a tight glowing edge. Severity = colour; a
    //  small count badge (extra ring) conveys stacking WITHOUT ever-widening halos. NON-additive so it
    //  does not bloom over neighbours; low opacity so structure behind stays visible.
    e.vulns.sort((a,b)=>(SEV_RANK[b.severity]||0)-(SEV_RANK[a.severity]||0));
    const worst=e.vulns[0].severity;
    const col=new THREE.Color(sceneSev(worst));
    const s=Math.max(1.4,e.r*0.55);                   // compact — a marker on the component, not a halo
    // solid-ish body mapped to the component footprint (a small cube sitting on the node)
    const body=new THREE.Mesh(new THREE.BoxGeometry(s,s,s),
      new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.34,depthWrite:false}));
    body.position.copy(e.pos);body.userData.layer='glows';body.renderOrder=6;scene.add(body);e.sprites.push(body);
    // tight glowing edge so it reads as "this shape is flagged" rather than a light blob
    const edge=new THREE.LineSegments(new THREE.EdgesGeometry(body.geometry),
      new THREE.LineBasicMaterial({color:col,transparent:true,opacity:.85}));
    edge.position.copy(e.pos);edge.userData.layer='glows';edge.renderOrder=7;scene.add(edge);e.sprites.push(edge);
    // stacking is shown by subtle severity-tinted wire rings whose radius is CAPPED (never a bonfire)
    const rings=Math.min(3,e.vulns.length-1);

      const rad=s*(0.7+i*0.35), pts=[];
      for(let k=0;k<=24;k++){const th=k/24*Math.PI*2;pts.push(new THREE.Vector3(Math.cos(th)*rad,0,Math.sin(th)*rad));}
      const rg=new THREE.BufferGeometry().setFromPoints(pts);
      const ring=new THREE.Line(rg,new THREE.LineBasicMaterial({color:col,transparent:true,opacity:.30}));
      ring.position.copy(e.pos);ring.userData.layer='glows';ring.renderOrder=6;scene.add(ring);e.sprites.push(ring);
    }
    const tag=sevTagSprite(worst,e.vulns.length);
    tag.position.copy(e.pos).add(new THREE.Vector3(0,s*0.9+1.5,0));tag.userData.layer='glows';tag.renderOrder=8;scene.add(tag);
    e.pulseSeed=hash01(hashStr(e.key));e.worst=worst;
  }
}
// chain lines — drawn on hover: connect a hovered glow to the other vulns in its chain. Depth-tested,
// so a seam passing behind a building is hidden by it rather than drawn through it.
let chainLine=null;
function showChain(e){
  clearChain();
  const ids=new Set();for(const v of e.vulns)if(v.chain)v.chain.forEach(id=>ids.add(id));
  const seg=[];for(const id of ids){const o=glowByVulnId[id];if(o&&o!==e){seg.push(e.pos.x,e.pos.y,e.pos.z,o.pos.x,o.pos.y,o.pos.z);}}
  if(!seg.length)return;
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(seg),3));
  chainLine=new THREE.LineSegments(g,new THREE.LineBasicMaterial({color:lp().chain,transparent:true,opacity:.9}));
  chainLine.renderOrder=8;scene.add(chainLine);
}
function clearChain(){if(chainLine){scene.remove(chainLine);chainLine.geometry.dispose();chainLine.material.dispose();chainLine=null;}}

// LAYER 7 — NOIR FLOOR: #000000 @ .85, VARIABLE transparency. A plane with per-vertex alpha baked
// from local district density (dense/clean areas → more transparent, letting the void show through;
// sparse/edge areas → more opaque). Implemented via a vertex-alpha ShaderMaterial (no external libs).
function buildNoirFloor(L,span){
  const N=48,SIZE=Math.max(400,(span||300)*2.4);
  const geo=new THREE.PlaneGeometry(SIZE,SIZE,N,N);geo.rotateX(-Math.PI/2);
  // density field: count files near each vertex → alpha. dense ⇒ lower alpha (see-through over the city)
  const pos=geo.attributes.position,alpha=new Float32Array(pos.count);
  const pts=L.files.map(f=>[f.x,f.z]);
  let maxD=1;const dens=new Float32Array(pos.count);
  for(let i=0;i<pos.count;i++){const vx=pos.getX(i),vz=pos.getZ(i);let d=0;
    for(const [px,pz] of pts){const dx=vx-px,dz=vz-pz;const r2=dx*dx+dz*dz;d+=1/(1+r2*.01);}
    dens[i]=d;if(d>maxD)maxD=d;}
  for(let i=0;i<pos.count;i++){const t=dens[i]/maxD; // 0..1 density
    alpha[i]=0.85*(1-0.55*t);}                        // .85 baseline, down to ~.38 over dense/clean city
  geo.setAttribute('alpha',new THREE.BufferAttribute(alpha,1));
  const mat=new THREE.ShaderMaterial({
    transparent:true,depthWrite:false,
    uniforms:{uColor:{value:new THREE.Color(TH.floor)}},
    vertexShader:`attribute float alpha;varying float vA;varying vec3 vP;void main(){vA=alpha;vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`uniform vec3 uColor;varying float vA;varying vec3 vP;void main(){
      // subtle radial vignette adds "variable" read even where density is flat
      float r=length(vP.xz)/${(SIZE/2).toFixed(1)};
      float a=clamp(vA*(1.0-0.15*r),0.05,0.9);
      gl_FragColor=vec4(uColor,a);}`
  });
  const g=new THREE.Mesh(geo,mat);g.position.y=-.6;g.renderOrder=0;g.userData.layer='floor';scene.add(g);
}

// ── Monolith: the repo as one megalith. Black-glass slab, facade panels per service, glowing
// apertures where the code opens to the world, the file constellation dimly lit inside.
function buildMonolith(T,svcs){
  const ML=layoutMonolith(svcs||M.services);   // B3: consume semantic ordering; fall back to manifest order
  const {W,D,H,panels,at}=ML;
  const span=Math.max(W,H,D)*1.75;
  // camera climbs 8% on Y (T.camY*1.08) — matches the treemap/radial path; framing + dolly clamp unchanged.
  camera.position.set(span*.72,span*T.camY*1.08,span*.95);controls.target.set(0,0,0);
  camera.far=Math.max(4000,span*8);camera.updateProjectionMatrix();
  // clamp dolly to the slab extent (see buildScene note) — the monolith/megalith is one big object.
  controls.minDistance=span*.15;controls.maxDistance=span*2.6;
  const slab=new THREE.Mesh(new THREE.BoxGeometry(W,H,D),
    new THREE.MeshPhongMaterial({color:0x04060a,transparent:true,opacity:.86,shininess:80,specular:0x1a2733,depthWrite:false}));
  slab.renderOrder=2;scene.add(slab);
  const edges=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(W,H,D)),
    new THREE.LineBasicMaterial({color:0x0aaebf,transparent:true,opacity:.75}));
  edges.renderOrder=3;scene.add(edges);
  scene.add(new THREE.AmbientLight(0xffffff,.5));
  const dl=new THREE.DirectionalLight(0x9fd8ff,.55);dl.position.set(span,span*1.2,span*.6);scene.add(dl);
  const gh=new THREE.GridHelper(span*8,120,T.grid[0],T.grid[1]); // the deck's neon horizon
  gh.position.y=-H/2-46;scene.add(gh);
  { // panel separators — faint vertical seams between service facades
    const segs=[];
    for(const p of panels){const a=at(p.u0);segs.push(a.x+a.nx*.35,-H/2,a.z+a.nz*.35,a.x+a.nx*.35,H/2,a.z+a.nz*.35);}
    const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(segs),3));
    const l=new THREE.LineSegments(g,new THREE.LineBasicMaterial({color:0x063a44,transparent:true,opacity:.8}));
    l.renderOrder=3;scene.add(l);
  }
  { // interior constellation — "like city lights, receding"
    const pos=[],colA=[];const c=new THREE.Color();
    const inset=Math.min(W,D)*.44;
    M.services.forEach((s,i)=>{
      const p=panels[i];const leaves=leavesOf(s.tree);
      leaves.forEach((n,k)=>{
        const h1=hash01(i*7919+k*13+1),h2=hash01(i*104729+k*31+2),h3=hash01(i*1299709+k*61+3);
        const a=at(p.u0+1.5+Math.max(.1,p.u1-p.u0-3)*h1);
        const depth=2.5+h2*inset;
        pos.push(a.x-a.nx*depth,-H/2+6+(H-14)*h3,a.z-a.nz*depth);
        c.set(langColor(n.lang)).lerp(new THREE.Color(0x000003),s.lifecycle?.85:.6);
        colA.push(c.r,c.g,c.b);
      });
    });
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(pos),3));
    g.setAttribute('color',new THREE.BufferAttribute(new Float32Array(colA),3));
    const pts=new THREE.Points(g,new THREE.PointsMaterial({size:1.15,vertexColors:true,transparent:true,opacity:.85,depthWrite:false}));
    pts.renderOrder=1;scene.add(pts);
  }
  // apertures — the openings/transparency. Per-service I/O rendered as additive neon cut-outs
  // arranged in a facade grid; overflow gets an explicit '+N more' slit (no silent caps).
  const inst=[];
  const CELL=5.2,VCELL=4.6,TOP=10,BOT=8;
  const rows=Math.max(1,Math.floor((H-TOP-BOT)/VCELL));
  M.services.forEach((s,i)=>{
    const p=panels[i];
    const io=[...(s.io||[])];
    const ext=(M.externalLinks||[]).filter(l=>l.service===s.id);
    if(ext.length)io.push({kind:'external',detail:ext.length+' distinct external links',count:ext.reduce((a,l)=>a+l.count,0),source:''});
    if(!io.length)return;

    // clamp every column's u inside [u0, u1]
    const uAt=(j)=>Math.max(p.u0+.6,Math.min(p.u1-.6,p.u0+1+CELL*(j%cols)+CELL/2));
    const shown=io.slice(0,io.length>cap?cap-1:cap);
    shown.forEach((it,j)=>{
      inst.push({a:at(uAt(j)),y:H/2-TOP-((j/cols)|0)*VCELL,it,svc:s});
    });
    if(io.length>cap){
      const j=cap-1;
      inst.push({a:at(uAt(j)),y:H/2-TOP-((j/cols)|0)*VCELL,svc:s,
        it:{kind:'more',detail:`+${io.length-shown.length} more — click for the full I/O list`,count:io.length-shown.length,source:''}});
    }
  });
  if(inst.length){
    // the one additive pass: apertures are the neon, sparse, each on its own facade cell
    apMesh=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,.7),
      new THREE.MeshBasicMaterial({blending:blend(),transparent:true,depthWrite:false}),inst.length);
    const dummy=new THREE.Object3D(),c=new THREE.Color();
    inst.forEach((q,j)=>{
      const st=KIND_STYLE[q.it.kind]||[2,2];
      dummy.position.set(q.a.x+q.a.nx*.55,q.y,q.a.z+q.a.nz*.55);
      dummy.rotation.set(0,(q.a.face===1||q.a.face===3)?Math.PI/2:0,0);
      dummy.scale.set(st[0],st[1],1);

    apMesh.renderOrder=4;scene.add(apMesh);
  }
  panels.forEach((p,i)=>{ // HUD labels along the top edge
    const s=M.services[i],a=at((p.u0+p.u1)/2);
    const el=document.createElement('div');el.className='svclabel mono';
    el.style.color=s.lifecycle?T.hudDim:T.hud;
    el.textContent=s.name+(s.lifecycle==='superseded'?' · standby':s.lifecycle==='retired'?' · retired':'');
    keyLabel(el,()=>showServiceIO(s));
    stage.appendChild(el);
    svcLabels.push({el,pos:new THREE.Vector3(a.x+a.nx*2.5,H/2+5,a.z+a.nz*2.5)});
  });
  if(T.exterior)buildExteriorFaults(ML,T); // EXTERIOR view: smooth-glass faces vs vuln fault lines
}

// EXTERIOR fault pass (Megalith view). For each vulnerability targeting a service, deform that
// service's slab panel into a physical fault whose GEOMETRY encodes the vuln TYPE:
//   memory    → jagged crack       (thin zig-zag emissive fracture line)
//   fracture  → splitting shard    (a wedge pushed out of the face)
//   corrosion → rust/pitting       (cluster of dim pocked sprites)
//   breach    → a hole punched through the face (dark ring + glow rim)
//   erosion   → a worn/melted dent (soft smear)
//   generic   → hairline seam
// Clean panels are left glass-smooth (nothing added). Faults inherit severity colour + register in
// glowNodes so hover shows the vuln and chained CVEs draw seams across the megalith's face.
//
// DISTRIBUTION FOLLOWS FUNCTION (feature 2b): a fault is NOT scattered randomly across the panel —
// it lands on the facade region of the SERVICE it belongs to at a position DERIVED FROM the affected
// file/function. The panel [p.u0,p.u1] is the same per-service span the apertures + interior
// constellation walk with at(u); we find the target file's ORDINAL among the service's leaves (the
// same leaf order the constellation uses) and map it to a u along the panel, and derive height y from
// the symbol's line / the file's position in the tree. Feature-detected & honest: when the vuln's
// file can't be resolved to a leaf (container-scope image vulns, or a stale path) it degrades to the
// old stable hash scatter so nothing is dropped. Reuses hashStr + the panel/at machinery already here.
function faultAnchor(v,p,H,at){
  const t=v.target||{};
  // the affected path/symbol: function→ref.file+ref.symbol, file→ref (string) + service, else none
  const path=t.scope==='function'?(t.ref&&t.ref.file):(t.scope==='file'?(typeof t.ref==='string'?t.ref:t.ref&&t.ref.file):null);
  const symbol=t.scope==='function'?(t.ref&&t.ref.symbol):null;
  const svc=p.svc, leaves=svc&&svc.tree?leavesOf(svc.tree):[];
  let idx=-1,leaf=null;
  if(path&&leaves.length){idx=leaves.findIndex(n=>(n.path||n.name)===path);if(idx>=0)leaf=leaves[idx];}
  if(idx<0){ // unresolved (image/container vuln or stale path) — honest fallback to stable scatter
    const u=p.u0+(p.u1-p.u0)*(0.2+0.6*hash01(hashStr(v.id)));
    return {u,y:(-0.3+0.6*hash01(hashStr(v.id)+7))*H,resolved:false};
  }
  // u = the leaf's fractional position along its service panel (same ordinal the constellation walks),
  // inset from the seams so faults don't sit on a panel edge. This makes a vuln on file #k land at the
  // facade column for file #k — spatially co-located with where that file's lights are inside.

          document.title=pageTitle(PROJECT,PROJECT?'no data':'no project');
          $('foot').innerHTML=PROJECT
            ?`<span style="color:var(--bad)">no sitemap data for ${esc(PROJECT)}${curSnap!=='current'?' @ '+esc(curSnap):''} (${esc(e.message)}) — run <b>node monitor/sitemap-data.mjs</b></span>`
            :`<span style="color:var(--bad)">no project selected — open this page with <b>?project=&lt;slug&gt;</b> (${esc(e.message)})</span>`;
        });
    });
}
// build the snapshot list: 'current' plus whatever the data layer injected. Feature-detected: absent
// or malformed __CW_SNAPSHOTS__ → just 'current' (dropdown still renders, single option, honest).
function snapshotOptions(){
  const out=[{id:'current',label:'current'}];
  const raw=(typeof window!=='undefined')&&window.__CW_SNAPSHOTS__;
  if(Array.isArray(raw)){
    for(const s of raw){
      if(s==null)continue;
      const id=typeof s==='string'?s:(s.id||s.snap||s.name);
      if(!id||id==='current')continue;
      out.push({id:String(id),label:String((typeof s==='object'&&(s.label||s.name))||id)});
    }
  }
  return out;
}
(function wireHistoryControl(){
  const sel=$('snap-select'),slider=$('snap-slider'),modeBox=$('snap-slider-mode');
  if(!sel)return;                       // feature-detect the chrome (embed builds may strip it)
  const opts=snapshotOptions();
  sel.innerHTML=opts.map(o=>`<option value="${esc(o.id)}">${esc(o.label)}</option>`).join('');
  slider.max=String(Math.max(0,opts.length-1));
  sel.onchange=()=>{ if(!sel.value)return; loadSitemap(sel.value); };
  slider.oninput=()=>{ // slider MODE is a stub for now — map index→snapshot + log, per the brief
    const i=Math.max(0,Math.min(opts.length-1,parseInt(slider.value,10)||0));
    console.log('slider mode',{index:i,snapshot:opts[i]&&opts[i].id});
    if(sel)sel.value=opts[i]?opts[i].id:'current';
  };
  if(modeBox)modeBox.onchange=()=>{ // radio/checkbox: flip dropdown ⇄ time-slider (slider = stub)
    const on=modeBox.checked;
    console.log('slider mode',on?'on':'off');
    if(slider)slider.style.display=on?'':'none';
    if(sel)sel.style.display=on?'none':'';
  };
})();
// The reader switched light/dark in the panel (or the OS did, on auto): redraw in the new mode. The
// chrome follows through the CSS tokens; the scene and the legend's swatches are drawn from JS.
addEventListener('cw-mode',()=>{
  if(!M)return;
  buildScene();
  if(side.classList.contains('open')&&side.dataset.mode==='legend')showLegend();
});
loadSitemap(curSnap);
</script>
