              patterns:
                - pattern-not: '"..."'
                - pattern-not: "'...'"

  # Fallbacks for the format! calls the two Rust rules at the top cannot see (see the header).
  # $E keeps the text match to code; the parsed-format! exclusion leaves every site those rules
  # can judge to them, so no line is reported twice.
  - id: cw-sql-text-assembled-rust-nested
    languages: [rust]
    severity: INFO
    message: >-
      SQL statement text is assembled at run time, in a format! call that Semgrep does not parse
      as a call (it sits inside another macro, or has a non-trivial argument). When every
      interpolated piece is a constant or an allow-listed identifier this is safe; confirm that,
      or bind the value as a parameter.
    metadata:
      category: security
      subcategory: [audit]
      cwe: ['CWE-89: Improper Neutralization of Special Elements used in an SQL Command']
      confidence: LOW
      class: sql-text-assembled
    paths:
      exclude:
        - '*_test.rs'
        - '*_tests.rs'
        - 'tests.rs'
        - '*.test.*'
        - '*.spec.*'
        - '**/tests/**'
        - '**/test/**'
        - '**/__tests__/**'
        - '**/_tests/**'
        - '**/testing/**'
        - '**/benches/**'
        - '**/bench/**'
        - '**/fuzz/**'
        - '**/fuzzer/**'
    patterns:
      - pattern-regex: '(?s)\bformat!\s*\(\s*"(?=(?:\\.|[^"\\])*?(?<![{$?])\{(?!\{)(?!\s*(?:[A-Z][A-Z0-9_]*|\w*(?:[Pp]laceholders?|[Mm]arks|[Bb]inds?))\s*(?::[^{}]*)?\})[^{}]*\})\s*(?:SELECT\b(?:\\.|[^"\\])*?\bFROM\b|INSERT\s+(?:OR\s+\w+\s+)?INTO\b|(?:REPLACE|MERGE|UPSERT)\s+INTO\b|UPDATE\s+(?:\\.|[^\s"\\])+\s+SET\b|DELETE\s+FROM\b|DECLARE\s+(?:\\.|[^\s"\\])+\s+(?:NO\s+)?(?:SCROLL\s+)?CURSOR\b|CREATE\s+(?:OR\s+REPLACE\s+)?(?:(?:TEMP|TEMPORARY|UNIQUE)\s+)?(?:TABLE|VIEW|INDEX|SCHEMA|DATABASE|FUNCTION|PROCEDURE|TRIGGER)\s+(?:IF\s+(?:NOT\s+)?EXISTS\s+)?`?[\w."\[\]{}$\\]+`?(?=[\s(;"''`]|$)|(?:DROP|ALTER)\s+(?:TABLE|VIEW|INDEX|SCHEMA|DATABASE|FUNCTION|PROCEDURE|TRIGGER)\s+(?:IF\s+(?:NOT\s+)?EXISTS\s+)?`?[\w."\[\]{}$\\]+`?(?=[\s(;"''`]|$)|TRUNCATE\s+TABLE\b|WITH\s+\w+\s+AS\s*\(|select\b(?:\\.|[^"\\])*?\bfrom\b|insert\s+(?:or\s+\w+\s+)?into\b|(?:replace|merge|upsert)\s+into\b|update\s+(?:\\.|[^\s"\\])+\s+set\b|delete\s+from\b|declare\s+(?:\\.|[^\s"\\])+\s+(?:no\s+)?(?:scroll\s+)?cursor\b|create\s+(?:or\s+replace\s+)?(?:(?:temp|temporary|unique)\s+)?(?:table|view|index|schema|database|function|procedure|trigger)\s+(?:if\s+(?:not\s+)?exists\s+)?`?[\w."\[\]{}$\\]+`?(?=[\s(;"''`]|$)|(?:drop|alter)\s+(?:table|view|index|schema|database|function|procedure|trigger)\s+(?:if\s+(?:not\s+)?exists\s+)?`?[\w."\[\]{}$\\]+`?(?=[\s(;"''`]|$)|truncate\s+table\b|with\s+\w+\s+as\s*\()'
      - pattern-inside: $E
      - pattern-not-inside: format!($FMT, ...)
      # A name an assert (or debug_assert) restricts to a fixed set with matches!.
      - pattern-not-regex: *guard-asserted
      # A name bound by a match whose every arm is a string literal (ASC/DESC).
      - pattern-not-regex: *guard-literal-match
      # A name derived from an ALL_CAPS constant.
      - pattern-not-regex: *guard-from-constant
      # A clause joined from fragments, in a function that binds its values with params_from_iter.
      - pattern-not-regex: *guard-joined-fragments
      # A (clause, params) pair from a builder, in a function that binds with params_from_iter.
      - pattern-not-regex: *guard-clause-and-params
      # A quoted list of .as_str() labels from a Type::fn(..) call (an enum's fixed set).
      - pattern-not-regex: *guard-enum-labels
      - pattern-not-regex: *cfg-test-module
      - pattern-not-inside: |
          #[test]
          fn $F(...) { ... }

