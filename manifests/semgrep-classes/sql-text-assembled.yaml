          - metavariable-regex:
              metavariable: $LIT
              regex: '(?s)^\s*(?:SELECT\b.*?\bFROM\b|INSERT\s+(?:OR\s+\w+\s+)?INTO\b|(?:REPLACE|MERGE|UPSERT)\s+INTO\b|UPDATE\s+\S+\s+SET\b|DELETE\s+FROM\b|DECLARE\s+\S+\s+(?:NO\s+)?(?:SCROLL\s+)?CURSOR\b|CREATE\s+(?:OR\s+REPLACE\s+)?(?:(?:TEMP|TEMPORARY|UNIQUE)\s+)?(?:TABLE|VIEW|INDEX|SCHEMA|DATABASE|FUNCTION|PROCEDURE|TRIGGER)\s+(?:IF\s+(?:NOT\s+)?EXISTS\s+)?`?[\w."\[\]{}$\\]+`?(?=[\s(;"''`]|$)|(?:DROP|ALTER)\s+(?:TABLE|VIEW|INDEX|SCHEMA|DATABASE|FUNCTION|PROCEDURE|TRIGGER)\s+(?:IF\s+(?:NOT\s+)?EXISTS\s+)?`?[\w."\[\]{}$\\]+`?(?=[\s(;"''`]|$)|TRUNCATE\s+TABLE\b|WITH\s+\w+\s+AS\s*\(|select\b.*?\bfrom\b|insert\s+(?:or\s+\w+\s+)?into\b|(?:replace|merge|upsert)\s+into\b|update\s+\S+\s+set\b|delete\s+from\b|declare\s+\S+\s+(?:no\s+)?(?:scroll\s+)?cursor\b|create\s+(?:or\s+replace\s+)?(?:(?:temp|temporary|unique)\s+)?(?:table|view|index|schema|database|function|procedure|trigger)\s+(?:if\s+(?:not\s+)?exists\s+)?`?[\w."\[\]{}$\\]+`?(?=[\s(;"''`]|$)|(?:drop|alter)\s+(?:table|view|index|schema|database|function|procedure|trigger)\s+(?:if\s+(?:not\s+)?exists\s+)?`?[\w."\[\]{}$\\]+`?(?=[\s(;"''`]|$)|truncate\s+table\b|with\s+\w+\s+as\s*\().*?(?:''|(?:=|<>|!=|<=|>=|<|>|\b(?i:LIKE)|\b(?i:IN)\s*\()|\b(?i:VALUES)\s*\([^)]*)\s*$'
